replicaCount: 1
service:
  type: ClusterIP
  port: 80
  portName: http
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "bustling-ghost.radoncanyon.com"
ingress:
  enabled: false
persistence:
  config:
    enabled: true
    existingClaim: config
  media:
    enabled: true
    existingClaim: media
resources:
  limits:
    gpu.intel.com/i915: 1
deploymentStrategy:
  type: Recreate
image:
  repository: docker.io/alpine
  tag: latest
jellyfin:
  args:
  - sleep
  - infinity
startupProbe: null
livenessProbe:
  httpGet: null
  initialDelaySeconds: 999999999
  tcpSocket:
    port: http
readinessProbe:
  httpGet: null
  initialDelaySeconds: 999999999
  tcpSocket:
    port: http
extraVolumes:
- name: config-nas1-mtank
  persistentVolumeClaim:
    claimName: config-nas1-mtank
extraVolumeMounts:
- name: config-nas1-mtank
  mountPath: /config-new

# Uncomment for normal operation
#
# image: {}
# jellyfin: {}
# startupProbe: {}
# livenessProbe: {}
# readinessProbe: {}
# extraVolumes: []
# extraVolumeMounts: []
