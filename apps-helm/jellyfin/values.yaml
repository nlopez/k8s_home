service:
  type: ClusterIP
  port: 80
  portName: http
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"

ingress:
  enabled: false

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 50Gi
    storageClass: rook-ceph-block
  media:
    enabled: true
    existingClaim: media-jellyfin

resources:
  limits:
    gpu.intel.com/i915: 1

deploymentStrategy:
  type: Recreate
