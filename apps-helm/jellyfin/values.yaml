service:
  type: ClusterIP
  port: 80
  portName: http
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "bustling-ghost.radoncanyon.com"

ingress:
  enabled: false

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 50Gi
    storageClass: rook-ceph-block
  media:
    enabled: true
    existingClaim: media-jellyfin

resources:
  limits:
    gpu.intel.com/i915: 1

deploymentStrategy:
  type: Recreate
