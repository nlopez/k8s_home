replicaCount: 1
service:
  type: ClusterIP
  port: 80
  portName: http
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "bustling-ghost.radoncanyon.com"
ingress:
  enabled: false
persistence:
  config:
    enabled: true
    existingClaim: config
  media:
    enabled: true
    existingClaim: media
resources:
  limits:
    gpu.intel.com/i915: 1
deploymentStrategy:
  type: Recreate

