service:
  type: LoadBalancer

ingress:
  enabled: true
  className: tailscale
  tls:
  - hosts:
    - jellyfin
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              name: http

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: rook-ceph-block
  media:
    enabled: true
    existingClaim: media-jellyfin
