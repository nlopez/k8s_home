derpServerHostname: derp.desertbluffs.com

service:
  enabled: true
  type: LoadBalancer
  annotations:
    # Fixed IP (next free one after pms's .2 and the gateways' .10/.20) so a
    # NAT rule can be pointed at it. The chart's Service template doesn't
    # pass through spec.loadBalancerIP, so request it via Cilium's LB-IPAM
    # annotation instead.
    lbipam.cilium.io/ips: "10.43.64.30"
    # The chart's own default annotation for this
    # ("externaldns.alpha.kubernetes.io/hostname") is missing the hyphen in
    # "external-dns" and so external-dns never recognizes it ("No endpoints
    # could be generated" in its logs). Null it out and set the correctly
    # spelled key ourselves, matching jellyfin's values.yaml elsewhere in
    # this repo.
    externaldns.alpha.kubernetes.io/hostname: null
    external-dns.alpha.kubernetes.io/hostname: derp.desertbluffs.com
    # DERP is public (unlike most Services here, which are internal LB IPs
    # meant for a NAT rule to poke a specific hole for): CNAME to the same
    # public target the internet Gateway uses, instead of an A record
    # pointing at the internal LB IP directly.
    external-dns.alpha.kubernetes.io/target: 'lga1.desertbluffs.com'
  # derper binds :8443 internally (see DERP_A below) instead of :443 -
  # non-root + capabilities.add:[NET_BIND_SERVICE] alone doesn't let this
  # image bind <1024: runc only puts the added capability in the container's
  # bounding set, not its effective/ambient set, for a non-root USER image
  # like this one, so the bind still fails with EACCES. Binding high and
  # letting the Service remap 443 -> 8443 avoids needing root or the
  # capability at all. The plaintext :80 listener is disabled outright
  # (DERP_HTTP_PORT=-1 below) since nothing here needs it: TLS is manual
  # (cert-manager), not derper's own ACME HTTP-01.
  ports:
  - name: https
    port: 443
    targetPort: 8443
  - name: stun
    port: 3478
    targetPort: 3478

tls:
  enabled: true
  domain: '{{ include "tailscale-derp.hostname" . }}'
  clusterIssuer: letsencrypt-prod

env:
- name: GOMAXPROCS
  valueFrom:
    resourceFieldRef:
      resource: limits.cpu
- name: GOMEMLIMIT
  valueFrom:
    resourceFieldRef:
      resource: limits.memory
- name: DERP_HOSTNAME
  value: '{{ include "tailscale-derp.hostname" . }}'
- name: DERP_CERTMODE
  value: "manual"
- name: DERP_CERTDIR
  value: "/app/certs"
# Listen on an unprivileged port; see the comment on service.ports above.
- name: DERP_A
  value: ":8443"
# Disable derper's own plaintext HTTP listener entirely - unneeded and would
# otherwise also fail to bind :80 for the same non-root/capability reason.
- name: DERP_HTTP_PORT
  value: "-1"
# Restrict relaying to nodes that are verified members of our own tailnet,
# via the tailscaled sidecar container below.
- name: DERP_VERIFY_CLIENTS
  value: "true"

# The chart's baked-in /app/healthprobe.sh curls https://$DERP_HOSTNAME/derp/
# probe - i.e. the *external* hostname/LB IP. That only works from outside
# the cluster: pods can't hairpin back to their own Cilium LB-IPAM VIP
# (10.43.64.30) from inside the cluster, so that probe always fails here
# with "no route to host". Override all three probes to hit derper directly
# on localhost:8443 instead (still validating the real hostname/cert via
# --resolve), which is what these probes actually care about anyway.
startupProbe:
  exec:
    command:
    - /bin/bash
    - -c
    - |
      curl --head -L -k -s -o /dev/null -m 5 \
        --resolve "${DERP_HOSTNAME}:8443:127.0.0.1" \
        "https://${DERP_HOSTNAME}:8443/derp/probe" || exit 1
      if [ "${DERP_VERIFY_CLIENTS}" = "true" ]; then
        tailscale status --peers=false --json | grep -q '"Online": *true' || exit 1
      fi
  periodSeconds: 10
  failureThreshold: 60
  timeoutSeconds: 60

livenessProbe:
  exec:
    command:
    - /bin/bash
    - -c
    - >-
      curl --head -L -k -s -o /dev/null -m 5
      --resolve "${DERP_HOSTNAME}:8443:127.0.0.1"
      "https://${DERP_HOSTNAME}:8443/derp/probe"
  timeoutSeconds: 60

readinessProbe:
  exec:
    command:
    - /bin/bash
    - -c
    - >-
      curl --head -L -k -s -o /dev/null -m 5
      --resolve "${DERP_HOSTNAME}:8443:127.0.0.1"
      "https://${DERP_HOSTNAME}:8443/derp/probe"
  timeoutSeconds: 60

# Sidecar tailscaled joined to our tailnet, required by DERP_VERIFY_CLIENTS.
# Non-ephemeral, persisted identity: this is long-running infra, not a
# scale-to-zero job, so it should behave like any other always-on tailnet
# server (stable node, key expiry disabled) rather than re-joining as a
# fresh device on every pod restart. See manifests/onepassword-item.yaml and
# manifests/rbac.yaml for the auth key and secret-access RBAC this needs.
tailscaled:
  volumeMounts:
  - name: pipes
    mountPath: /tmp
  env:
  - name: TS_HEALTHCHECK_ADDR_PORT
    value: 0.0.0.0:9002
  - name: TS_USERSPACE
    value: "true"
  - name: TS_KUBE_SECRET
    value: "tailscale-derp-state" # persists node identity across restarts
  - name: TS_AUTH_KEY
    valueFrom:
      secretKeyRef:
        name: onepassword-tailscale-derp-authkey
        key: credential
  livenessProbe:
    httpGet:
      path: /healthz
      port: 9002

serviceAccount:
  create: true
  # tailscaled needs its own token to talk to the Kubernetes API for
  # TS_KUBE_SECRET (persisted node identity) - the chart defaults this to
  # false.
  automount: true

# No longer needs NET_BIND_SERVICE: derper binds :8443, not :443 (see
# service.ports above), so drop the capability entirely rather than keep an
# addition that doesn't actually work for this non-root image anyway.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

volumes:
- name: pipes
  emptyDir: {}
- name: cert
  secret:
    secretName: '{{ .Release.Name }}-tls'

volumeMounts:
- name: pipes
  mountPath: /var/run/tailscale
- name: cert
  mountPath: '/app/certs/{{ include "tailscale-derp.hostname" . }}.crt'
  subPath: tls.crt
- name: cert
  mountPath: '/app/certs/{{ include "tailscale-derp.hostname" . }}.key'
  subPath: tls.key
  readOnly: true
