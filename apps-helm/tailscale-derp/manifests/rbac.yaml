# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-derp-state
rules:
# `create` can't be scoped to a resourceName, so it's split from the rest.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["tailscale-derp-state"]
  verbs: ["get", "update", "patch"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-derp-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-derp-state
subjects:
# Must match the chart's ServiceAccount name, which with serviceAccount.create
# and no name override equals the Helm release name (tailscale-derp).
- kind: ServiceAccount
  name: tailscale-derp
