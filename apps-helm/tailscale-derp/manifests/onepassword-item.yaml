# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/onepassword.com/onepassworditem_v1.json
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: onepassword-tailscale-derp-authkey
spec:
  # Auth key generated via Admin console > Settings > Keys > Generate auth
  # key..., stored in 1Password's built-in "credential" field for this item.
  #
  # This is a plain pre-auth key for joining a node to the tailnet - NOT an
  # OAuth client (that's what apps-helm/tailscale-operator's operator-oauth
  # item is, for a different purpose: the operator managing its own proxy
  # devices). No OAuth is involved here.
  #
  # This key needs no ACL grants/permissions beyond tailnet membership: the
  # tailscaled sidecar only uses its LocalAPI to look up the identity of the
  # peer dialing derper's noise-encrypted port 443 (to enforce
  # DERP_VERIFY_CLIENTS), it never dials out to other tailnet nodes, so it
  # doesn't need routes, exit-node, or SSH access.
  #
  # Required key settings, all set when generating it:
  #   - Reusable:       no   - state is persisted (TS_KUBE_SECRET points at
  #                            a real Secret, see manifests/rbac.yaml), so
  #                            the key is only ever consumed once, at first
  #                            boot; later restarts reuse the saved identity
  #                            instead of rejoining from scratch.
  #   - Ephemeral:      no   - this is long-running infra (a DERP relay),
  #                            not a scale-to-zero job, so it should behave
  #                            like any other always-on tailnet server:
  #                            a stable node that doesn't get removed from
  #                            the tailnet just because the pod restarted.
  #   - Pre-authorized: yes  - so the node doesn't sit needing manual
  #                            approval in the admin console after joining.
  #   - Tags:           tag:k8s  - matches defaultTags already used by
  #                            tailscale-operator's proxies; lets ACLs grant
  #                            this node exactly the k8s-workload policy
  #                            without a human owning the device.
  #   - Expiry:         short is fine (e.g. 90 days) - the key itself is
  #                            single-use, consumed at first boot.
  #
  # After the node's first successful join, also disable key EXPIRY for
  # that *device* (Admin console > Machines > this node > Disable key
  # expiry) - the standard recommendation for always-on servers, so the
  # tailnet doesn't force it to reauth and drop offline on its own.
  itemPath: "vaults/evjh25ux2mnoufaut6qhvm2pdi/items/hrd6iaxvihmowa6kikzxxx5cgi"
