# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
#
# The external library scan only re-imports an asset when the media file's mtime
# changes, and nothing in Immich schedules sidecar or metadata jobs. icloudpd
# writes .xmp files next to each photo, so this job:
#   1. scans every external library so new photos are imported (library queue)
#   2. links .xmp files to assets that have none linked yet (sidecar queue,
#      force=false); this only records the path, it doesn't read the file
#   3. re-extracts metadata for every asset, reading each linked .xmp, so new
#      and changed sidecar contents land (metadataExtraction queue, force=true)
#
# The icloudpd job (apps/icloudpd/cronjob.yaml) starts a Job from this template
# as soon as each icloudpd pass finishes (kubectl create job --from=...), so the
# schedule itself is suspended. To run it by hand:
#   kubectl create job -n immich --from=cronjob/immich-sidecar-sync immich-sidecar-sync-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-sidecar-sync
spec:
  suspend: true
  schedule: '0 5 * * *'
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # One Job per icloudpd pass (hourly); remove each a day after it finishes
      # so they don't pile up.
      ttlSecondsAfterFinished: 86400
      # Worst case: 20m scan + 15m sidecar + 30m extraction wait.
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            tags.datadoghq.com/env: homelab
            tags.datadoghq.com/service: immich-sidecar-sync
            tags.datadoghq.com/version: v1
        spec:
          # IMMICH_URL is a 4-dot FQDN; ndots:1 resolves it as absolute
          # instead of walking the search list through Technitium first.
          dnsConfig:
            options:
            - name: ndots
              value: "1"
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: sync
            image: docker.io/curlimages/curl:8.11.1
            env:
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onepassword-immich-sidecar-cronjob
                  key: credential
            - name: IMMICH_URL
              value: http://immich-server.immich.svc.cluster.local:2283
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            command:
            - /bin/sh
            - -ec
            - |-
              api() { curl -fsS --max-time 30 -H "x-api-key: ${IMMICH_API_KEY}" -H 'content-type: application/json' "$@"; }

              # Prints the number of active + waiting + delayed jobs in a queue.
              pending() {
                counts=$(api "${IMMICH_URL}/api/queues/$1" | grep -o '"\(active\|waiting\|delayed\)":[0-9]*')
                echo "${counts}" | cut -d: -f2 | awk '{s+=$1} END {print s+0}'
              }

              start() {
                api -X PUT "${IMMICH_URL}/api/jobs/$1" -d "{\"command\":\"start\",\"force\":$2}" >/dev/null
              }

              # Waits up to $2 polls of 15s for a queue to drain; returns non-zero if it doesn't.
              wait_drained() {
                for _ in $(seq 1 "$2"); do
                  [ "$(pending "$1")" -eq 0 ] && return 0
                  sleep 15
                done
                return 1
              }

              # Scan every external library (GET /api/libraries returns only
              # libraries, so every "id" key is a library ID).
              libraries=$(api "${IMMICH_URL}/api/libraries" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
              for id in ${libraries}; do
                echo "scanning library ${id}"
                api -X POST "${IMMICH_URL}/api/libraries/${id}/scan" -d '{}' >/dev/null
              done
              sleep 15
              wait_drained library 80 || { echo "library queue did not drain within 20m" >&2; exit 1; }

              echo "linking sidecars"
              start sidecar false
              sleep 15
              wait_drained sidecar 60 || { echo "sidecar queue did not drain within 15m" >&2; exit 1; }

              # Linking a sidecar doesn't queue extraction (Immich v3.4.1), but the
              # library scan queues it for newly imported assets, and a previous
              # run's forced extraction may still be going. Immich rejects
              # starting a queue that has active jobs, so if it stays busy only
              # the re-extract is skipped; the scan and linking above still ran.
              wait_drained metadataExtraction 120 || { echo "metadataExtraction still busy after 30m, skipping until the next icloudpd pass"; exit 0; }

              echo "re-extracting metadata"
              start metadataExtraction true
              echo "queued"
