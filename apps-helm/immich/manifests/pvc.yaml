---
# Immich library using shared NFS media volume
# References the existing media NFS PV with immich subfolder
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
spec:
  volumeName: media
  resources:
    requests:
      storage: 1Pi
  accessModes:
    - ReadWriteMany

---
# Machine Learning cache volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-ml-cache
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  iscsi:
    targetPortal: 192.168.222.149
    iqn: iqn.2014-09.com.radoncanyon:nas1:immich-ml-cache
    lun: 0
    fsType: ext4
  mountOptions:
    - noatime
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
spec:
  volumeName: immich-ml-cache
  resources:
    requests:
      storage: 50Gi
  accessModes:
    - ReadWriteOnce
