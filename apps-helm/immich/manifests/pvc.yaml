# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolume-v1.json
# Immich library using shared NFS media volume
# Points directly to /mnt/etank/media/immich on the NFS share
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-nfs
spec:
  capacity:
    storage: 1Pi
  accessModes:
  - ReadWriteMany
  nfs:
    server: 192.168.222.114
    path: "/mnt/etank/media/immich"
  mountOptions:
  - nfsvers=4.1
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
  - noresvport
  - _netdev
  - nofail
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-nfs
spec:
  volumeName: immich-library-nfs
  resources:
    requests:
      storage: 1Pi
  accessModes:
  - ReadWriteMany
---
# Machine Learning cache volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-ml-cache
spec:
  capacity:
    storage: 50Gi
  accessModes:
  - ReadWriteOnce
  iscsi:
    targetPortal: 192.168.222.149
    iqn: iqn.2014-09.com.radoncanyon:nas1:immich-ml-cache
    lun: 0
    fsType: ext4
  mountOptions:
  - noatime
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
spec:
  volumeName: immich-ml-cache
  resources:
    requests:
      storage: 50Gi
  accessModes:
  - ReadWriteOnce
---
