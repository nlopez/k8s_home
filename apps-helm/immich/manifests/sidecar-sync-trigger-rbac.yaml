# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/role-rbac-v1.json
#
# Lets the icloudpd job start an immich-sidecar-sync Job (kubectl create job
# --from=cronjob/immich-sidecar-sync) as soon as each icloudpd pass finishes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-sidecar-sync-trigger
rules:
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  resourceNames: ["immich-sidecar-sync"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-sidecar-sync-trigger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: immich-sidecar-sync-trigger
subjects:
- kind: ServiceAccount
  name: icloudpd
  namespace: icloudpd
