# immich Helm chart values
# Official chart: https://github.com/immich-app/immich-charts
# This chart uses the bjw-s common library
# Shared configuration for all controllers
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.1.0
          pullPolicy: IfNotPresent
        env:
          # PostgreSQL configuration - uses external cloudnative-pg instance
          DB_HOSTNAME: immich-database-rw.immich.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_PASSWORD:
            secretKeyRef:
              name: onepassword-immich-database
              key: password
          DB_DATABASE_NAME: immich
          REDIS_HOSTNAME: immich-valkey.immich.svc.cluster.local
          REDIS_PORT: "6379"
immich:
  configuration: {}
  persistence:
    # Main data store for all photos shared between different components.
    library:
      existingClaim: immich-library-nfs
# Dependencies
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1-alpine
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: nas1-mtank-iscsi
# Immich components
server:
  enabled: true
  controllers:
    main:
      replicas: 2
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.1.0
            pullPolicy: IfNotPresent
          resources:
            requests:
              gpu.intel.com/i915: 1
            limits:
              gpu.intel.com/i915: 1
          env:
            # GPU settings for thumbnail generation
            IMMICH_FFMPEG_HWACCEL: qsv
  persistence:
    icloud:
      enabled: true
      existingClaim: immich-icloud-nfs
      advancedMounts:
        main:
          main:
          - path: /icloud
            readOnly: false
# Machine learning component
machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.1.0
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-ml-cache
      advancedMounts:
        main:
          main:
          - path: /cache
            readOnly: false
    icloud:
      enabled: true
      existingClaim: immich-icloud-nfs
      advancedMounts:
        main:
          main:
          - path: /icloud
            readOnly: false
    photosync:
      enabled: true
      existingClaim: immich-photosync-nfs
      advancedMounts:
        main:
          main:
          - path: /PhotoSync
