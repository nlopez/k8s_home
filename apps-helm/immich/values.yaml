---
# immich Helm chart values
# Official chart: https://github.com/immich-app/immich-charts
# This chart uses the bjw-s common library

# Shared configuration for all controllers
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v1.123.1  # Update to match your desired version
          pullPolicy: IfNotPresent
        env:
          # PostgreSQL configuration - uses external cloudnative-pg instance
          DB_HOSTNAME: immich-database-rw.immich.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_PASSWORD:
            secretKeyRef:
              name: onepassword-immich-database
              key: password
          DB_DATABASE_NAME: immich
          REDIS_HOSTNAME: immich-redis-master.immich.svc.cluster.local
          REDIS_PORT: "6379"

# Immich-specific configuration
immich:
  configuration: {}

# Main immich server
server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
  ingress:
    main:
      enabled: true
      className: envoy
      annotations:
        external-dns.alpha.kubernetes.io/hostname: immich.desertbluffs.com
      hosts:
        - host: immich.desertbluffs.com
          paths:
            - path: /
              service:
                identifier: main
      tls: []
  persistence:
    library:
      enabled: true
      existingClaim: immich-library
      accessMode: ReadWriteOnce

# Microservices component
microservices:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-microservices
            pullPolicy: IfNotPresent

# Machine learning component
machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-x-cache
      initContainers:
        01-download-models:
          enabled: true
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          command: [/bin/sh, -c, "python3 -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer(\"clip-ViT-B-32\").save(\"/cache/clip-vit-b-32\")' 2>&1 | grep -v \"^Some weights\""]
  persistence:
    cache:
      enabled: true
      existingClaim: immich-ml-cache
      accessMode: ReadWriteOnce

# PostgreSQL is NOT embedded - uses external cloudnative-pg
postgresql:
  enabled: false

# Valkey (Redis) for caching
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 8.0-alpine
            pullPolicy: IfNotPresent
  persistence:
    data:
      enabled: true
      size: 5Gi
      existingClaim: immich-redis
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
