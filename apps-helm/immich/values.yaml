---
# immich Helm chart values
# Official chart: https://helm.immich.app/
# Reference: https://github.com/immich-app/immich-charts/blob/main/README.md

image:
  tag: v1.123.1  # Update this to the latest version as needed

env:
  # PostgreSQL configuration - uses external cloudnative-pg instance
  DB_HOSTNAME: immich-database-rw.immich.svc.cluster.local
  DB_PORT: "5432"
  DB_USERNAME: immich
  DB_PASSWORD: # Password is synced from 1Password via OnePasswordItem
    secretKeyRef:
      name: onepassword-immich-database
      key: password
  DB_DATABASE_NAME: immich

  # Redis configuration
  REDIS_HOSTNAME: immich-redis-master.immich.svc.cluster.local
  REDIS_PORT: "6379"

immich:
  # Note: Do NOT set environment variables here as they override the global env
  # Use the global env section above instead

server:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-server
    pullPolicy: IfNotPresent

  persistence:
    library:
      enabled: true
      # NOTE: You must create this PVC separately before installing this chart
      existingClaim: immich-library

microservices:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-microservices
    pullPolicy: IfNotPresent

machinelearning:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    pullPolicy: IfNotPresent
  persistence:
    cache:
      enabled: true
      existingClaim: immich-ml-cache

# PostgreSQL is NOT embedded - use external cloudnative-pg instance
# See manifests/cloudnative-pg.yaml for the recommended PostgreSQL setup
postgresql:
  enabled: false

# Redis configuration - uses iSCSI volume
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi
      existingClaim: immich-redis

# Ingress configuration
ingress:
  enabled: true
  className: envoy
  annotations:
    external-dns.alpha.kubernetes.io/hostname: immich.desertbluffs.com
  hosts:
    - host: immich.desertbluffs.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# HTTPRoute for Gateway API (if using Envoy Gateway)
# Uncomment to enable
# httproute:
#   enabled: true
#   annotations:
#     external-dns.alpha.kubernetes.io/hostname: immich.desertbluffs.com
#   parentRefs:
#     - name: internet
#       namespace: envoy-gateway-system
#       group: gateway.networking.k8s.io
#       kind: Gateway
#   hostnames:
#     - immich.desertbluffs.com
