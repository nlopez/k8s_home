---
# immich Helm chart values
# Official chart: https://github.com/immich-app/immich-charts
# This chart uses the bjw-s common library

# Shared configuration for all controllers
controllers:
  main:
    containers:
      main:
        image:
          tag: v1.123.1  # Update to match your desired version
          pullPolicy: IfNotPresent
        env:
          # PostgreSQL configuration - uses external cloudnative-pg instance
          DB_HOSTNAME: immich-database-rw.immich.svc.cluster.local
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_PASSWORD:
            secretKeyRef:
              name: onepassword-immich-database
              key: password
          DB_DATABASE_NAME: immich
          REDIS_HOSTNAME: immich-redis-master.immich.svc.cluster.local
          REDIS_PORT: "6379"

# Immich-specific configuration
immich:
  configuration: {}
  persistence:
    library:
      existingClaim: immich-library

# Main immich server
server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
  ingress:
    main:
      enabled: true
      className: envoy
      annotations:
        external-dns.alpha.kubernetes.io/hostname: immich.desertbluffs.com
      hosts:
        - host: immich.desertbluffs.com
          paths:
            - path: /
              service:
                identifier: main
      tls: []

# Microservices component
microservices:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-microservices

# Machine learning component
machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-ml-cache
      size: 50Gi
      accessMode: ReadWriteOnce

# PostgreSQL is NOT embedded - uses external cloudnative-pg
postgresql:
  enabled: false

# Valkey (Redis replacement) for caching
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.0-alpine
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-redis
      size: 5Gi
      accessMode: ReadWriteOnce
