githubConfigUrl: https://github.com/nlopez/k8s_home
githubConfigSecret: arc-github-app
runnerScaleSetName: home-runners
# One warm runner per node (see topologySpreadConstraints) so jobs skip pod startup.
minRunners: 2
maxRunners: 4
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller
template:
  spec:
    serviceAccountName: diff-runner
    automountServiceAccountToken: true
    containers:
    - name: runner
      image: ghcr.io/actions/actions-runner:2.338.2
      command:
      - /home/runner/run.sh
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          actions.github.com/scale-set-name: home-runners
