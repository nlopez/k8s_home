# Enable MagicDNS resolution from within the cluster
# Required for workloads to resolve .ts.net names (e.g., cdi-uploadproxy.macaroni-pirate.ts.net)
# and for TLS certificate validation against MagicDNS names.
apiVersion: tailscale.com/v1alpha1
kind: DNSConfig
metadata:
  name: ts-dns
spec:
  nameserver:
    image:
      repo: tailscale/k8s-nameserver
      tag: unstable
