# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |-
    .:53 {
      errors
      # Queried names with the client pod IP, for deriving per-namespace egress
      # allowlists. NXDOMAIN (search-path expansion) is excluded to cut noise.
      log . "{remote} {type} {name} {rcode}" {
        class success
      }
      health {
        lameduck 5s
      }
      ready
      kubernetes cluster.local in-addr.arpa ip6.arpa {
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
        ttl 30
      }
      prometheus :9153
      # Technitium (pinned LoadBalancer IP) serves the private radoncanyon.com
      # zone, including the external NAS hosts, and recurses for everything else.
      # The router is only used when Technitium is unreachable.
      forward . 10.43.64.53 192.168.222.1 {
        policy sequential
      }
      cache 30 {
        disable success cluster.local
        disable denial cluster.local
      }
      loop
      reload
      loadbalance
    }
