# Lets the arc-runners diff-runner service account drive this Argo CD
# (kubectl port-forward, applications, the admin secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diff-runner
  namespace: argocd-diff-preview
rules:
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diff-runner
  namespace: argocd-diff-preview
subjects:
- kind: ServiceAccount
  name: diff-runner
  namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: diff-runner
