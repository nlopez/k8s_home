# Technitium DNS Server Helm chart values
# Chart: https://github.com/obeone/charts/tree/master/charts/technitium-dnsserver
# (inherits from the k8s-at-home common library chart)
#
# Authoritative resolver for nulogorsk.com, radoncanyon.com, and desertbluffs.com
# (private side), updated dynamically via RFC2136 by the external-dns-technitium app.
# Exposed directly on its own LoadBalancer IP; deliberately NOT routed through
# envoy-gateway to avoid a circular dependency between DNS and gateway routing.
env:
  TZ: America/New_York

service:
  main:
    # Preserve the real client source IP end-to-end. Without this, Cilium
    # SNATs cross-node LoadBalancer-IP traffic to the receiving node's own
    # LAN IP (default externalTrafficPolicy: Cluster), which collapses both
    # LAN clients and the heimdall tailnet ingress proxy down to whichever
    # node's IP happened to receive the packet -- making it impossible for
    # Technitium to tell LAN and tailnet clients apart by source IP.
    externalTrafficPolicy: Local
    annotations:
      lbipam.cilium.io/ips: "10.43.64.53"
      # Have the Tailscale operator stand up an ingress proxy in front of
      # this Service so Technitium is also reachable over the tailnet,
      # independent of its Cilium LoadBalancer IP.
      tailscale.com/expose: "true"
      tailscale.com/hostname: technitium
      tailscale.com/proxy-group: heimdall

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: technitium-config
    mountPath: /etc/dns
