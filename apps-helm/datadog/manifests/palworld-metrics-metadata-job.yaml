# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/job-batch-v1.json
# Datadog doesn't infer units from a metric's name - it only shows correct
# axis labels/formatting once "unit" (and optionally "per_unit") metadata is
# set on the metric, via the UI or the Metrics API:
# https://docs.datadoghq.com/api/latest/metrics/#edit-metric-metadata
#
# This is an ArgoCD PostSync hook: it runs after every sync of this
# Application and sets metadata on the custom palworld.* metrics emitted by
# the check in values.yaml (datadog.checksd). A metric has to have been
# submitted at least once before the API will accept metadata for it, so
# this only takes effect once that check has run successfully; the PUT
# calls are idempotent, so re-running them on every sync is harmless.
#
# Hardcodes api.datadoghq.com to match datadog.site (values.yaml) - update
# both together if the site ever changes.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: palworld-metrics-metadata-
  labels:
    app: palworld-metrics-metadata
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: palworld-metrics-metadata
    spec:
      restartPolicy: Never
      containers:
      - name: set-metadata
        image: curlimages/curl:8.11.1
        env:
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-keys
              key: api-key
        - name: DD_APP_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-keys
              key: app-key
        command:
        - /bin/sh
        - -c
        - |
          set -eu

          set_unit() {
            metric="$1"
            unit="$2"
            echo "Setting ${metric} unit=${unit}"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
              "https://api.datadoghq.com/api/v1/metrics/${metric}" \
              -H "DD-API-KEY: ${DD_API_KEY}" \
              -H "DD-APPLICATION-KEY: ${DD_APP_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"unit\":\"${unit}\"}")
            if [ "$code" -ge 300 ]; then
              echo "  -> HTTP ${code}: $(cat /tmp/resp.json)"
              exit 1
            fi
            echo "  -> HTTP ${code}"
          }

          set_unit palworld.server.fps hertz
          set_unit palworld.server.frame_time_ms millisecond
          set_unit palworld.players.current item
          set_unit palworld.players.max item
          set_unit palworld.uptime second
          set_unit palworld.basecamps item
          set_unit palworld.days day
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
