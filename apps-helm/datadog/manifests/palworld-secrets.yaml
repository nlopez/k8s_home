# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/onepassword.com/onepassworditem_v1.json
# Mirrors apps/palworld/game/onepassword-item.yaml (same 1Password item) into
# the datadog namespace. The custom `palworld` check's Autodiscovery
# instance needs the REST API admin password via
# %%env_PALWORLD_ADMIN_PASSWORD%%, which Datadog only resolves from the
# Agent's own container env (see values.yaml datadog.env) - it cannot read
# the Secret that already exists in the palworld namespace directly.
# Creates a K8s Secret named `palworld-secrets` with keys: adminPassword,
# serverPassword.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: palworld-secrets
spec:
  itemPath: "vaults/evjh25ux2mnoufaut6qhvm2pdi/items/dvjiv3rsvgyyjyovyo4s3am62y"
