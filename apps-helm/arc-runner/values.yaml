# GitHub Actions Runner Controller (ARC) — runner scale set values (unstable)
# Explicitly set controller service account to bypass Helm chart's label-based
# discovery (which fails during Argo CD comparison before the controller deploys)
controllerServiceAccount:
  namespace: actions-runner-controller
  name: arc-gha-rs-controller
githubConfigUrl: "https://github.com/nlopez/k8s_home"
githubConfigSecret: arc-github-app-secret
runnerGroup: "default"
minRunners: 0
maxRunners: 4
ephemeral: true
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"
