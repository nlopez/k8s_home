# GitHub App credentials synced from 1Password → Kubernetes secret
#
# BEFORE applying this manifest:
#   1. Create a GitHub App (see instructions below)
#   2. Create a 1Password item in the k8s_home vault with:
#      - Title: "arc-github-app"
#      - Fields:
#        - label=github_app_id, type=STRING, value=<APP_ID>
#        - label=github_app_installation_id, type=STRING, value=<INSTALLATION_ID>
#        - label=github_app_private_key, type=CONCEALED, value=<PEM_KEY>
#   3. Replace the itemPath below with the actual item ID
#
# GitHub App creation:
#   https://github.com/settings/apps/new
#   Name: k8s-home-arc-runner
#   Homepage URL: https://github.com/actions/actions-runner-controller
#   Permissions:
#     Administration: Read and write
#     Metadata: Read only
#   Install on your account
#   Note the App ID, Installation ID, and generate a private key
#
# Then create the item:
#   op item create \
#     --vault k8s_home \
#     --category APPLICATION_CREDENTIAL \
#     --title "arc-github-app" \
#     --fields 'type=STRING,label=github_app_id,value=APP_ID',\
#       'type=STRING,label=github_app_installation_id,value=INSTALLATION_ID',\
#       'type=CONCEALED,label=github_app_private_key,value="-----BEGIN RSA PRIVATE KEY-----\\n...\\n-----END RSA PRIVATE KEY-----"'
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: arc-github-app-secret
  namespace: arc-runners
spec:
  itemPath: vaults/copxopw5gkuo2m3cv7acvkrfxy/items/fv5qv4dqbrgaqn254dewtzwyvq
status: {}
