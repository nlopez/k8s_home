csiDriver:
  name: "org.democratic-csi.nas1-mtank-iscsi"
driver:
  existingConfigSecret: democratic-csi-nas1-mtank-driver-config
  config:
    driver: freenas-api-iscsi
controller:
  # Pinned: the driver image's :latest tag will move to the TrueNAS 26+ WebSocket rewrite, which
  # cannot talk to TrueNAS 25.x. This digest is the :latest build (commit 3974268, Jan 2026) that
  # predates it. Bump together with the TrueNAS upgrade.
  driver:
    image:
      tag: latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced
  externalSnapshotter:
    enabled: true
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: democratic-csi-nas1-mtank
    tags.datadoghq.com/version: v1
node:
  driver:
    image:
      tag: latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: democratic-csi-nas1-mtank
    tags.datadoghq.com/version: v1
# VolumeSnapshotClass is managed via standalone manifest in manifests/
# (Helm chart v0.15.1 renders empty parameters as null, which K8s rejects)
storageClasses:
- name: nas1-mtank-iscsi
  defaultClass: false
  reclaimPolicy: Retain
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    fsType: ext4
  mountOptions:
  - noatime
