connect:
  create: true
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  # Keep credentials in an out-of-git secret named op-credentials.
  credentialsName: op-credentials
  credentialsKey: 1password-credentials.json
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: onepassword-connect
    tags.datadoghq.com/version: v1
operator:
  create: true
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  authMethod: connect
  # Keep token in an out-of-git secret named onepassword-token.
  token:
    name: onepassword-token
    key: token
  podLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: onepassword-connect
    tags.datadoghq.com/version: v1
