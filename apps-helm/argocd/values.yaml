global:
  domain: argocd.macaroni-pirate-ts.net
configs:
  cm:
    resource.exclusions: |
      - apiGroups:
          - velero.io
        kinds:
          - Backup
          - Restore
        clusters:
          - "*"
  params:
    server.insecure: true
server:
  ingress:
    enabled: true
    hostname: ""
    ingressClassName: tailscale
    annotations:
      tailscale.com/proxy-group: heimdall
      tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
      tailscale.com/hostname: argocd
    tls: false
    extraRules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: '{{ include "argo-cd.server.fullname" . }}'
              port:
                name: '{{ .Values.server.service.servicePortHttpName }}'
    extraTls:
    - hosts:
      - argocd
  httproute:
    enabled: false
