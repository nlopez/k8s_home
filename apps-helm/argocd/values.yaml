global:
  domain: argocd.macaroni-pirate-ts.net
configs:
  cm:
    # ---- resource.exclusions ----
    # Resources ArgoCD should completely ignore (not discovered at all)
    resource.exclusions: |
      - apiGroups:
          - velero.io
        kinds:
          - Backup
          - Restore
        clusters:
          - "*"
      - apiGroups:
          - postgresql.cnpg.io
        kinds:
          - ClusterRestore
          - ClusterBackup
        clusters:
          - "*"
      - apiGroups:
          - externaldns.k8s.io
        kinds:
          - DNSEndpoint
        clusters:
          - "*"
      - apiGroups:
          - batch
        kinds:
          - Job
        clusters:
          - "kube-system.*"
    # ---- resource.customizations ----
    # Ignore cert-manager Certificate status (conditions, notusThrough, etc.)
    resource.customizations.ignoreDifferences.cert-manager.io_Certificate: |
      jsonPointers:
      - /status
    # Ignore Reloader's pod-template annotation on Deployments/StatefulSets/DaemonSets
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
    resource.customizations.ignoreDifferences.apps_DaemonSet: |
      jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  params:
    server.insecure: true
server:
  ingress:
    enabled: true
    hostname: ""
    ingressClassName: tailscale
    annotations:
      tailscale.com/proxy-group: heimdall
      tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
      tailscale.com/hostname: argocd
    tls: false
    extraRules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: '{{ include "argo-cd.server.fullname" . }}'
              port:
                name: '{{ .Values.server.service.servicePortHttpName }}'
    extraTls:
    - hosts:
      - argocd
  httproute:
    enabled: false
# Increase liveness/readiness probe timeouts to prevent CLBO under load.
# The default 1s timeout is too short when the repo server processes many
# concurrent manifest generation calls (e.g. ~20 apps syncing).
repoServer:
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
