# Separate hostname for native grpc (argocd login without --grpc-web),
# kept off the existing web HTTPRoute entirely -- see service-h2c-patch.yaml
# for why. Testing on the private gateway first before mirroring to internet.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/grpcroute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: argocd-server-grpc-private
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/hostname: argocd-grpc.radoncanyon.com
spec:
  parentRefs:
  - name: private
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - argocd-grpc.radoncanyon.com
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      port: 443
      weight: 1
