# Marks the argocd-server Service's "https" port (443, unused by any route
# today) as h2c so Envoy Gateway can speak HTTP/2 prior-knowledge upstream
# for it specifically. The "http" port (80) that the existing web HTTPRoute
# uses is deliberately left untouched: forcing h2c on that port broke the
# web UI, because argocd-server multiplexes grpc and REST/web on one port
# via cmux-based connection sniffing, which doesn't tolerate being forced
# into pure h2c for non-grpc traffic (see git history on this file).
#
# grpc traffic is routed separately via a GRPCRoute -> port 443, on its own
# hostname, per Gateway API's requirement that an HTTPRoute and a GRPCRoute
# can't share a hostname on the same listener. See grpcroute-private.yaml.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8080
    appProtocol: kubernetes.io/h2c
