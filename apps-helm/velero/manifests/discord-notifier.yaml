# Velero Discord Notifier
#
# Watches Velero Backup and Restore custom resources every 5 minutes and
# sends Discord embedded notifications when any resource transitions to a
# terminal phase: Completed, PartiallyFailed, or Failed.
#
# Only backups that complete after the notifier first starts are notified.
# activeSince is set to the current time on the first run (or if the
# ConfigMap is wiped), and used as a permanent cutoff. To reset the cutoff
# after a redeploy, delete the ConfigMap and let it recreate.
#
# The Discord webhook URL is read from the same 1Password item as the
# Velero S3/DigitalOcean credentials. The OnePasswordItem operator
# syncs every field, so the `discord-webhook` key is already present in
# the credentials-velero Secret with no additional manifests needed.
# ---- RBAC ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-discord-notifier
  namespace: velero
  labels:
    app: velero
    component: discord-notifier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-discord-notifier
  namespace: velero
  labels:
    app: velero
    component: discord-notifier
rules:
- apiGroups: ["velero.io"]
  resources: ["backups", "restores", "podvolumebackups"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-discord-notifier
  namespace: velero
  labels:
    app: velero
    component: discord-notifier
subjects:
- kind: ServiceAccount
  name: velero-discord-notifier
  namespace: velero
roleRef:
  kind: Role
  name: velero-discord-notifier
  apiGroup: rbac.authorization.k8s.io
---
# ---- State ConfigMap ----
# Two keys, both managed exclusively by the CronJob:
#   activeSince  ISO8601 UTC timestamp. Set to now on the first run (empty
#                value). Only backups whose completionTimestamp is at or
#                after this value are ever notified. Delete this ConfigMap
#                to reset the cutoff (e.g. after a redeploy).
#   state        JSON map of resource name → last-notified phase, used to
#                deduplicate repeat notifications for the same terminal state.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-notifier-state
  namespace: velero
  labels:
    app: velero
    component: discord-notifier
data:
  activeSince: ""
  state: "{}"
  sizes: "{}"
---
# ---- Notifier CronJob ----
apiVersion: batch/v1
kind: CronJob
metadata:
  name: velero-discord-notifier
  namespace: velero
  labels:
    app: velero
    component: discord-notifier
spec:
  schedule: "*/5 * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: velero-discord-notifier
          containers:
          - name: notifier
            image: alpine/k8s:1.36.2
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              NAMESPACE="velero"
              STATE_CM="velero-notifier-state"
              WEBHOOK="${DISCORD_WEBHOOK_URL:-}"

              # ---- fmt_ts: ISO8601 → Discord relative timestamp <t:EPOCH:R> ----
              fmt_ts() {
                local ts="$1"
                if [ -z "$ts" ] || [ "$ts" = "N/A" ] || [ "$ts" = "null" ]; then
                  echo "N/A"
                  return
                fi
                # Normalise "2006-01-02T15:04:05Z" → "2006-01-02 15:04:05"
                local normalized
                normalized=$(echo "$ts" | sed 's/T/ /; s/Z//')
                local epoch
                epoch=$(date -u -d "$normalized" +%s 2>/dev/null) || { echo "$ts"; return; }
                echo "<t:${epoch}:R>"
              }

              # ---- format_bytes: bytes → human-readable (B, KiB, MiB, GiB) ----
              format_bytes() {
                local bytes="$1"
                if [ -z "$bytes" ] || ! [[ "$bytes" =~ ^[0-9]+$ ]]; then
                  echo "N/A"
                  return
                fi
                if [ "$bytes" -lt 1024 ]; then
                  echo "${bytes} B"
                elif [ "$bytes" -lt 1048576 ]; then
                  echo "$(jq -n "($bytes / 1024 * 10 | floor) / 10") KiB"
                elif [ "$bytes" -lt 1073741824 ]; then
                  echo "$(jq -n "($bytes / 1048576 * 10 | floor) / 10") MiB"
                else
                  echo "$(jq -n "($bytes / 1073741824 * 10 | floor) / 10") GiB"
                fi
              }

              # ---- get_backup_size: sum totalBytes from PodVolumeBackups for a backup ----
              get_backup_size() {
                local backup_name="$1"
                local pvs
                pvs=$(kubectl get podvolumebackups.velero.io -n "$NAMESPACE" \
                      -l "velero.io/backup-name=${backup_name}" -o json 2>/dev/null || echo '{"items":[]}')
                echo "$pvs" | jq '[.items[].status.progress.totalBytes // 0] | add // 0'
              }

              # ---- compute_duration: started + completed → human-readable duration ----
              compute_duration() {
                local started="$1" completed="$2"
                if [ -z "$started" ] || [ "$started" = "N/A" ] || [ -z "$completed" ] || [ "$completed" = "N/A" ]; then
                  echo "N/A"
                  return
                fi
                local start_epoch end_epoch
                start_epoch=$(date -u -d "$(echo "$started" | sed 's/T/ /; s/Z//')" +%s 2>/dev/null) || { echo "N/A"; return; }
                end_epoch=$(date -u -d "$(echo "$completed" | sed 's/T/ /; s/Z//')" +%s 2>/dev/null) || { echo "N/A"; return; }
                local diff=$((end_epoch - start_epoch))
                if [ "$diff" -lt 0 ]; then
                  echo "~0s"
                  return
                fi
                if [ "$diff" -lt 60 ]; then
                  echo "~${diff}s"
                elif [ "$diff" -lt 3600 ]; then
                  local mins=$((diff / 60))
                  local secs=$((diff % 60))
                  echo "~${mins}m ${secs}s"
                else
                  local hours=$((diff / 3600))
                  local mins=$(( (diff % 3600) / 60 ))
                  echo "~${hours}h ${mins}m"
                fi
              }

              # ---- send_discord ----
              send_discord() {
                local kind="$1" name="$2" phase="$3" schedule="$4" \
                      warnings="$5" errors="$6" started="$7" completed="$8" \
                      size="${9:-N/A}" delta="${10:-N/A}"

                if [ -z "$WEBHOOK" ]; then
                  echo "No DISCORD_WEBHOOK_URL — skipping notification for ${name}"
                  return 0
                fi

                local color emoji dur
                case "$phase" in
                  Completed)       color=5763713;  emoji="✅" ;;
                  PartiallyFailed) color=16776960; emoji="⚠️" ;;
                  Failed)          color=16711680; emoji="❌" ;;
                  *)               color=9807270;  emoji="ℹ️" ;;
                esac

                dur="$(compute_duration "$started" "$completed")"

                local payload
                payload=$(jq -n \
                  --arg title     "Velero ${kind} ${emoji}" \
                  --argjson color "$color" \
                  --arg name      "$name" \
                  --arg phase     "$phase" \
                  --arg schedule  "$schedule" \
                  --arg warnings  "$warnings" \
                  --arg errors    "$errors" \
                  --arg size      "$size" \
                  --arg delta     "$delta" \
                  --arg dur       "$dur" \
                  --arg emoji     "$emoji" \
                  '{
                    embeds: [{
                      title: $title,
                      color: $color,
                      fields: [
                        {name: "Name",         value: $name,         inline: false},
                        {name: "\($emoji) \($phase)", value: "\($schedule) · \($dur)", inline: true},
                        {name: "\($size)", value: "\($delta)", inline: true},
                        {name: "\($warnings) warnings", value: "\($errors) errors", inline: true}
                      ],
                      footer: {text: "Velero · k8s_home"}
                    }]
                  }')

                curl -sf -H "Content-Type: application/json" \
                  -d "$payload" "$WEBHOOK" \
                  && echo "Notified Discord: ${kind} ${name} → ${phase}" \
                  || echo "WARN: Discord notification failed for ${name}"
              }

              # ---- Load persisted state ----
              CM=$(kubectl get cm "$STATE_CM" -n "$NAMESPACE" -o json 2>/dev/null || echo '{}')
              STATE=$(echo "$CM" | jq -r '.data.state // "{}"')
              [ -z "$STATE" ] || [ "$STATE" = 'null' ] && STATE='{}'
              SIZES=$(echo "$CM" | jq -r '.data.sizes // "{}"')
              [ -z "$SIZES" ] || [ "$SIZES" = 'null' ] && SIZES='{}'
              ACTIVE_SINCE=$(echo "$CM" | jq -r '.data.activeSince // ""')
              NEW_STATE='{}'
              NEW_SIZES='{}'

              # Set activeSince on the first run (or if the ConfigMap was wiped).
              # All subsequent runs reuse this value as the notification cutoff.
              if [ -z "$ACTIVE_SINCE" ]; then
                ACTIVE_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                echo "activeSince initialised to ${ACTIVE_SINCE}"
              fi

              # ---- Process Backups ----
              BACKUPS=$(kubectl get backups.velero.io -n "$NAMESPACE" -o json)

              while IFS= read -r item; do
                name=$(echo "$item"  | jq -r '.metadata.name')
                phase=$(echo "$item" | jq -r '.status.phase // empty')

                [ -z "$phase" ] && continue

                case "$phase" in
                  Completed|PartiallyFailed|Failed)
                    NEW_STATE=$(echo "$NEW_STATE" | \
                      jq --arg k "$name" --arg v "$phase" '. + {($k): $v}')

                    old=$(echo "$STATE" | jq -r --arg k "$name" '.[$k] // empty')
                    completed=$(echo "$item" | jq -r '.status.completionTimestamp // "N/A"')
                    if [ "$old" != "$phase" ] && [ "$completed" '>' "$ACTIVE_SINCE" ]; then
                      schedule=$(echo "$item" | jq -r \
                        '.metadata.labels["velero.io/schedule-name"] // "manual"')
                      warnings=$(echo "$item"  | jq -r '.status.warnings          // 0')
                      errors=$(echo "$item"    | jq -r '.status.errors             // 0')
                      started=$(echo "$item"   | jq -r '.status.startTimestamp     // "N/A"')

                      # Extract backup size from PodVolumeBackups
                      backup_size_bytes=$(get_backup_size "$name")
                      backup_size_human=$(format_bytes "$backup_size_bytes")

                      # Look up previous size for this schedule
                      prev_size_bytes=$(echo "$SIZES" | jq -r --arg k "$schedule" '.[$k] // 0')

                      # Calculate delta
                      if [ "$prev_size_bytes" -gt 0 ] 2>/dev/null; then
                        delta_bytes=$((backup_size_bytes - prev_size_bytes))
                        if [ "$delta_bytes" -gt 0 ]; then
                          delta_human="📈 +$(format_bytes $delta_bytes) (↑)"
                        elif [ "$delta_bytes" -lt 0 ]; then
                          abs_delta=$(( -delta_bytes ))
                          delta_human="📉 -$(format_bytes $abs_delta) (↓)"
                        else
                          delta_human="— 0 B (—)"
                        fi
                      else
                        delta_human="— no previous size"
                      fi

                      # Update sizes map
                      NEW_SIZES=$(echo "$NEW_SIZES" | \
                        jq --arg k "$schedule" --argjson v "$backup_size_bytes" '. + {($k): $v}')

                      send_discord "Backup" "$name" "$phase" "$schedule" \
                                   "$warnings" "$errors" "$started" "$completed" \
                                   "$backup_size_human" "$delta_human"
                    fi
                    ;;
                esac
              done < <(echo "$BACKUPS" | jq -c '.items[]')

              # ---- Process Restores ----
              RESTORES=$(kubectl get restores.velero.io -n "$NAMESPACE" -o json \
                           2>/dev/null || echo '{"items":[]}')

              while IFS= read -r item; do
                name=$(echo "$item"  | jq -r '.metadata.name')
                phase=$(echo "$item" | jq -r '.status.phase // empty')

                [ -z "$phase" ] && continue

                case "$phase" in
                  Completed|PartiallyFailed|Failed)
                    key="restore/${name}"
                    NEW_STATE=$(echo "$NEW_STATE" | \
                      jq --arg k "$key" --arg v "$phase" '. + {($k): $v}')

                    old=$(echo "$STATE" | jq -r --arg k "$key" '.[$k] // empty')
                    completed=$(echo "$item" | jq -r '.status.completionTimestamp // "N/A"')
                    if [ "$old" != "$phase" ] && [ "$completed" '>' "$ACTIVE_SINCE" ]; then
                      warnings=$(echo "$item"  | jq -r '.status.warnings          // 0')
                      errors=$(echo "$item"    | jq -r '.status.errors             // 0')
                      started=$(echo "$item"   | jq -r '.status.startTimestamp     // "N/A"')
                      send_discord "Restore" "$name" "$phase" "manual" \
                                   "$warnings" "$errors" "$started" "$completed" \
                                   "N/A" "N/A"
                    fi
                    ;;
                esac
              done < <(echo "$RESTORES" | jq -c '.items[]')

              # ---- Persist updated state ----
              # Clean up old entries: keep only the latest 100 backup names
              CLEAN_STATE=$(echo "$NEW_STATE" | jq 'to_entries | sort_by(.key) | .[-100:] | from_entries')
              # jq -Rs '.' wraps the JSON string in a JSON string literal, safe for --patch
              STATE_JSON=$(echo "$CLEAN_STATE" | jq -c '.' | jq -Rs '.')
              SIZES_JSON=$(echo "$NEW_SIZES" | jq -c '.' | jq -Rs '.')
              kubectl patch cm "$STATE_CM" -n "$NAMESPACE" --type=merge \
                --patch "{\"data\":{\"activeSince\":\"${ACTIVE_SINCE}\",\"state\":${STATE_JSON},\"sizes\":${SIZES_JSON}}}" \
                && echo "State saved — activeSince=${ACTIVE_SINCE} entries=$(echo "$CLEAN_STATE" | jq 'length')" \
                || echo "WARN: Failed to save state to ConfigMap"
            env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: credentials-velero
                  key: discord-webhook
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
