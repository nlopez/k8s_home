# Hourly backup of the palworld namespace
# savegames PVC: CSI/ZFS snapshot via democratic-csi NFS driver
# config PVC: excluded (manifests only)
# Retains the last 24 hourly backups
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: palworld-hourly
  namespace: velero
spec:
  schedule: "0 * * * *"
  template:
    includedNamespaces:
    - palworld
    storageLocation: default
    ttl: 24h
    includeClusterResources: false
  paused: false
