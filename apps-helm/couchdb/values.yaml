clusterSize: 1

createAdminSecret: false
extraSecretName: onepassword-couchdb

couchdbConfig:
  couchdb:
    uuid: f0a91555a3fc467e96110077c6dce1d1
    max_document_size: 50000000
  httpd:
    WWW-Authenticate: Basic realm="couchdb"
  chttpd:
    enable_cors: true
    require_valid_user: true
    max_http_request_size: 4294967296
  cors:
    origins: "https://eldest-microchip.macaroni-pirate.ts.net,https://sofa.desertbluffs.com,https://sofa.radoncanyon.com,app://obsidian.md,http://localhost,capacitor://localhost"
    credentials: true

autoSetup:
  enabled: false
  image:
    repository: curlimages/curl
    tag: latest
    pullPolicy: Always
  defaultDatabases:
  - _global_changes
  - _users

persistentVolume:
  enabled: true
  existingClaims:
  - persistentVolumeName: database-storage
    volumeName: database-storage
    claimName: database-storage
    volumeSource:
      iscsi:
        targetPortal: 192.168.222.149
        iqn: iqn.2014-09.com.radoncanyon:nas1:couchdb
        lun: 1
        fsType: ext4
      mountOptions:
      - noatime
  storageClass: "-"
  accessModes:
  - ReadWriteOnce
  size: 10Gi

ingress:
  enabled: true
  className: tailscale
  hosts:
  - eldest-microchip.macaroni-pirate.ts.net
  tls:
  - hosts:
    - eldest-microchip
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
