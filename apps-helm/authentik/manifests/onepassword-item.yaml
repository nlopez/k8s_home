  # (bootstrap_password, bootstrap_token, bootstrap_email). Extra keys are
  # ignored by whichever consumer doesn't need them.
  itemPath: "vaults/evjh25ux2mnoufaut6qhvm2pdi/items/vr2a57oagehh7eldekcasukfne"
