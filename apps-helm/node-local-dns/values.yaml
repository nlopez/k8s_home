# NodeLocal DNSCache (https://kubernetes.io/docs/tasks/administer-cluster/nodelocaldns/)
#
# This cluster runs Cilium in kube-proxy-replacement mode with socketLB, so
# the classic iptables/link-local-IP interception NodeLocalDNS normally uses
# doesn't apply (there's no kube-proxy iptables chain to hook, and Cilium's
# socket-level LB intercepts connect() before iptables would ever see it).
# Instead this uses Cilium's CiliumLocalRedirectPolicy (enabled via
# localRedirectPolicies.enabled in apps-helm/cilium/values.yaml) to redirect
# traffic bound for the kube-dns Service to the local node's cache pod.
#
# Pods keep talking to the same kube-dns ClusterIP as before — no kubelet
# --cluster-dns / kubeadm-init.conf changes needed.
config:
  # Required by the chart even in Cilium mode; not used as a bind address
  # here (Corefile binds 0.0.0.0 when config.cilium is set) but must still
  # be set. See https://github.com/lablabs/k8s-nodelocaldns-helm chart README.
  localDnsIp: "10.43.32.10" # kube-dns ClusterIP
  cilium:
    clusterDNSService: kube-dns
    clusterDNSNamespace: kube-system
    udp:
      enabled: true
      portName: dns
    tcp:
      enabled: true
      portName: dns-tcp
