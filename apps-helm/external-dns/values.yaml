provider:
  name: cloudflare
env:
- name: CF_API_TOKEN
  valueFrom:
    secretKeyRef:
      name: cloudflare-api-token
      key: api-token
sources:
- service
- ingress
- gateway-httproute
- gateway-grpcroute
- gateway-tlsroute
- gateway-tcproute
- gateway-udproute
extraArgs:
- --txt-new-format-only
extraVolumes:
- name: txt-encrypt-aes-key
  secret:
    secretName: txt-encrypt-aes-key
extraVolumeMounts:
- name: txt-encrypt-aes-key
  mountPath: /etc/external-dns/txt-encrypt-aes-key
  readOnly: true
