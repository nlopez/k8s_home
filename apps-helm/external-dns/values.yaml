image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.23.0
# Required by chart >= 1.22; upsert-only was the previous chart default.
policy: upsert-only
provider:
  name: cloudflare
env:
- name: CF_API_TOKEN
  valueFrom:
    secretKeyRef:
      name: cloudflare-api-token
      key: api-token
- name: EXTERNAL_DNS_TXT_ENCRYPT_AES_KEY
  valueFrom:
    secretKeyRef:
      name: txt-encrypt-aes-key
      key: aes_key
- name: EXTERNAL_DNS_TXT_ENCRYPT_ENABLED
  value: "true"
# - name: EXTERNAL_DNS_POLICY
#   value: sync
sources:
- service
- ingress
- crd
- gateway-httproute
- gateway-grpcroute
- gateway-tlsroute
- gateway-tcproute
- gateway-udproute
extraArgs:
# Only the internet gateway should drive desertbluffs.com DNS records.
# The private gateway's radoncanyon.com routes are published to Cloudflare by
# the external-dns-private app.
- --gateway-name=internet
# radoncanyon.com is owned by external-dns-private; keep this instance scoped
# to desertbluffs.com.
- --domain-filter=desertbluffs.com
# Causes extraneous record updates
# - --cloudflare-record-comment=managed by external-dns
logLevel: debug
podLabels:
  tags.datadoghq.com/env: homelab
  tags.datadoghq.com/service: external-dns
  tags.datadoghq.com/version: v1
