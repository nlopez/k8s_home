image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.21.0
provider:
  name: cloudflare
env:
- name: CF_API_TOKEN
  valueFrom:
    secretKeyRef:
      name: cloudflare-api-token
      key: api-token
- name: EXTERNAL_DNS_TXT_ENCRYPT_AES_KEY
  valueFrom:
    secretKeyRef:
      name: txt-encrypt-aes-key
      key: aes_key
- name: EXTERNAL_DNS_TXT_ENCRYPT_ENABLED
  value: "true"
# - name: EXTERNAL_DNS_POLICY
#   value: sync
sources:
- service
- ingress
- crd
- gateway-httproute
- gateway-grpcroute
- gateway-tlsroute
- gateway-tcproute
- gateway-udproute
extraArgs:
# Only the internet gateway should drive desertbluffs.com DNS records.
# The private gateway's routes (including its desertbluffs.com mirror
# hostnames, needed for split-horizon routing) are managed out of band.
- --gateway-name=internet
# Causes extraneous record updates
# - --cloudflare-record-comment=managed by external-dns
logLevel: debug
