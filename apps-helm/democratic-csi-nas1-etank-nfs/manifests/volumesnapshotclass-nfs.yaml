# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/snapshot.storage.k8s.io/volumesnapshotclass_v1.json
# VolumeSnapshotClass for democratic-csi NFS driver
# Standalone manifest because democratic-csi Helm chart v0.15.1 has a template bug:
# empty parameters map renders as `parameters: null` instead of `parameters: {}`,
# which Kubernetes rejects. This manifest overrides/fills in the correct value.
#
# velero.io/csi-volumesnapshot-class label: tells Velero to use this class when
# taking CSI snapshots of NFS-backed PVCs (e.g. palworld/savegames).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: nas1-etank-nfs
  labels:
    velero.io/csi-volumesnapshot-class: "true"
driver: org.democratic-csi.nas1-etank-nfs
deletionPolicy: Delete
parameters: {}
