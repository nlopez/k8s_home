csiDriver:
  name: "org.democratic-csi.nas1-etank-nfs"
driver:
  existingConfigSecret: democratic-csi-nas1-etank-nfs-driver-config
  config:
    driver: freenas-api-nfs
controller:
  externalSnapshotter:
    enabled: true
# VolumeSnapshotClass is managed via standalone manifest in manifests/
# (Helm chart v0.15.1 renders empty parameters as null, which K8s rejects)
storageClasses:
- name: nas1-etank-nfs
  defaultClass: false
  reclaimPolicy: Retain
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    fsType: nfs
  mountOptions:
  - nfsvers=4.1
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
  - noresvport
  - nofail
