apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: cloudflare-authenticated-origin-pull
spec:
  tls:
    clientValidation:
      # Keep this optional by default so non-Cloudflare clients continue to work.
      optional: true
      caCertificateRefs:
      - kind: ConfigMap
        name: cloudflare-origin-pull-ca
        group: ""
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internet
    sectionName: wildcard-desertbluffs-com-https
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internet
    sectionName: wildcard-radoncanyon-com-https
