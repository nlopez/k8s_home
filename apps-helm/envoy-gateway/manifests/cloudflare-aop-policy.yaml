# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
# Cloudflare Authenticated Origin Pull enforcement for the Cloudflare-proxied
# desertbluffs.com HTTPS listeners on the internet gateway.
#
# Listener-scoped policies take precedence over the Gateway-wide `tls-settings`
# policy and are NOT merged with it, so the TLS settings are restated here.
# `http3` is deliberately omitted: Envoy rejects the QUIC listener when
# tls.clientValidation is combined with http3
# (https://github.com/envoyproxy/gateway/issues/8581). Cloudflare connects to
# the origin over HTTP/1.1 or HTTP/2, so this costs nothing for proxied traffic.
# Keep ALPN pinned (see tls-settings-policy.yaml) so h2/gRPC keeps working.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: cloudflare-aop
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internet
    sectionName: wildcard-desertbluffs-com-https
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internet
    sectionName: apex-desertbluffs-com-https
  tls:
    clientValidation:
      optional: false
      caCertificateRefs:
      - group: ""
        kind: Secret
        name: cloudflare-origin-pull-ca
    session:
      resumption:
        stateless: {}
        stateful: {}
    ecdhCurves:
    - X25519MLKEM768
    - X25519
    - P-256
    alpnProtocols:
    - h2
    - http/1.1
  headers:
    lateResponseHeaders:
      set:
      - name: strict-transport-security
        value: max-age=31536000; includeSubDomains
