apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tls-session-resumption
spec:
  tls:
    session:
      resumption:
        stateless: {}
    # Hybrid post-quantum ECDH: traditional + ML-KEM-1024 (Crystals-Kyber)
    ecdhCurves:
    - X25519
    - P-256
    - mlkem1024
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: Gateway
