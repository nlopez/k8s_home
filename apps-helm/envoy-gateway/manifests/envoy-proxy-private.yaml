# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        annotations:
          # Have the Tailscale operator stand up an ingress proxy in front
          # of this Service so the private gateway also gets its own
          # tailnet IP/hostname, independent of its Cilium LoadBalancer IP.
          tailscale.com/expose: "true"
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
