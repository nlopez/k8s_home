# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        # Dual-homed like technitium: Cilium's lbipam still owns this
        # Service's LoadBalancer IP (LAN/BGP-reachable pool address), and the
        # Tailscale operator additionally stands up an ingress proxy in front
        # of it via the annotations below, independent of the Cilium IP, so
        # the private gateway is reachable from both the LAN and the tailnet.
        allocateLoadBalancerNodePorts: false
        # Preserve the real client source IP end-to-end, same reasoning as
        # technitium's Service: without this, Cilium SNATs cross-node
        # LoadBalancer-IP traffic to the receiving node's own LAN IP (default
        # externalTrafficPolicy: Cluster), collapsing both LAN clients and
        # the heimdall tailnet ingress proxy down to whichever node's IP
        # happened to receive the packet.
        externalTrafficPolicy: Local
        annotations:
          # Pin the Cilium LB-IPAM address explicitly. Gateway.spec.addresses
          # alone doesn't reliably propagate to the generated Service's
          # actual assigned IP in this Envoy Gateway version, so request it
          # directly the same way technitium does.
          lbipam.cilium.io/ips: "10.43.64.10"
          # Have the Tailscale operator stand up an ingress proxy in front of
          # this Service, independent of its Cilium LoadBalancer IP (mirrors
          # technitium's dual-exposure pattern). loadBalancerClass isn't set
          # above, so this annotation -- normally auto-added by Envoy Gateway
          # when loadBalancerClass=tailscale -- must be set explicitly here.
          tailscale.com/expose: "true"
          # The operator's auto-generated hostname
          # (envoy-gateway-system-envoy-envoy-gateway-system-private-<hash>)
          # exceeds Tailscale's 63-byte hostname limit -- pin a short one.
          tailscale.com/hostname: envoy-gateway-private
          tailscale.com/proxy-group: heimdall
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        pod:
          # Datadog Envoy integration: scrape the proxy's Prometheus stats
          # via Autodiscovery. https://docs.datadoghq.com/integrations/envoy/
          annotations:
            ad.datadoghq.com/envoy.checks: |
              {
                "envoy": {
                  "init_config": {},
                  "instances": [
                    {
                      "openmetrics_endpoint": "http://%%host%%:19001/stats/prometheus"
                    }
                  ]
                }
              }
