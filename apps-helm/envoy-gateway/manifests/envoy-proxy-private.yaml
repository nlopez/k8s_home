# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        # Have the Tailscale operator -- not Cilium's lbipam -- become this
        # Service's LoadBalancer controller, so the private gateway is
        # reachable solely over the tailnet.
        loadBalancerClass: tailscale
        allocateLoadBalancerNodePorts: false
        annotations:
          # The operator's auto-generated hostname
          # (envoy-gateway-system-envoy-envoy-gateway-system-private-<hash>)
          # exceeds Tailscale's 63-byte hostname limit -- pin a short one.
          tailscale.com/hostname: envoy-gateway-private
          tailscale.com/proxy-group: heimdall
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
