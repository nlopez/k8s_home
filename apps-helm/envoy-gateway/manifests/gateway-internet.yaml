# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internet
  annotations:
    # Public hostnames CNAME to lga1; without this external-dns publishes the
    # gateway's private LB address. external-dns only reads the
    # external-dns.kubernetes.io/ prefix (legacy .alpha. prefix is disabled).
    external-dns.kubernetes.io/target: 'lga1.desertbluffs.com'
spec:
  gatewayClassName: internet
  addresses:
  - type: IPAddress
    value: 10.43.64.20
  listeners:
  - name: wildcard-desertbluffs-com-https
    protocol: HTTPS
    hostname: "*.desertbluffs.com"
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: omni-certificate-rsa
        group: ""
      - kind: Secret
        name: omni-certificate-ecdsa
        group: ""
    allowedRoutes:
      namespaces:
        from: All
  - name: apex-desertbluffs-com-https
    protocol: HTTPS
    hostname: "desertbluffs.com"
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: omni-certificate-rsa
        group: ""
      - kind: Secret
        name: omni-certificate-ecdsa
        group: ""
    allowedRoutes:
      namespaces:
        from: All
