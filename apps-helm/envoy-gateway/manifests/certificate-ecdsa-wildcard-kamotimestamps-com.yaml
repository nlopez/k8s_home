---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-kamotimestamps-com-cert-ecdsa
spec:
  secretName: wildcard-kamotimestamps-com-cert-ecdsa
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
  - '*.kamotimestamps.com'
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
