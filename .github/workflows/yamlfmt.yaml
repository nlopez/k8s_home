name: 'YAML Format Check'
on:
- pull_request
jobs:
  yamlfmt:
    name: 'YAML Format Check'
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Set up Go'
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.27'
        cache: false
    - name: 'Install yamlfmt'
      run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
    - name: 'Check YAML formatting'
      run: |-
        export PATH="$(go env GOPATH)/bin:$PATH"
        yamlfmt -lint -exclude 'bootstrap/apps.yaml' -exclude 'bootstrap/apps-helm.yaml' -exclude 'clusters/do/bootstrap/apps-helm.yaml' .
