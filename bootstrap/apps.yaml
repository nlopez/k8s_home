# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/nlopez/k8s_home.git
      revision: unstable
      directories:
      - path: apps/*
      - path: apps/*/overlays/*
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: default
      syncPolicy:
        automated:
{{- $syncFile := file (printf "%s/sync.yaml" .path.path) | default "" }}
{{- if and $syncFile (ne $syncFile "") }}
{{- $sync := fromYaml $syncFile }}
          enabled: {{ default true (index $sync "enabled") }}
          prune: {{ default false (index $sync "prune") }}
          selfHeal: {{ default false (index $sync "selfHeal") }}
{{- else }}
{{- if gt (len .path.segments) 2 }}
{{- $appDir := printf "apps/%s" (index .path.segments 1) }}
{{- $parentSync := file (printf "%s/sync.yaml" $appDir) | default "" }}
{{- if and $parentSync (ne $parentSync "") }}
{{- $sync := fromYaml $parentSync }}
          enabled: {{ default true (index $sync "enabled") }}
          prune: {{ default false (index $sync "prune") }}
          selfHeal: {{ default false (index $sync "selfHeal") }}
{{- else }}
          enabled: true
          prune: false
          selfHeal: false
{{- end }}
{{- else }}
          enabled: true
          prune: false
          selfHeal: false
{{- end }}
{{- end }}
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      sources:
      - repoURL: "https://github.com/nlopez/k8s_home.git"
        targetRevision: unstable
        path: "{{.path.path}}"
        directory:
          recurse: true
      destination:
        namespace: "{{.path.basename}}"
        server: https://kubernetes.default.svc
  templatePatch: |-
    {{- $patchedName := .path.basename }}
    {{- $patchedNamespace := .path.basename }}
    {{- if gt (len .path.segments) 2 }}
    {{- $patchedName = printf "%s-%s" (index .path.segments 1) .path.basename -}}
    {{- $patchedNamespace = printf "%s" (index .path.segments 1) -}}
    {{- end }}
    metadata:
      name: '{{ $patchedName }}'
    spec:
      destination:
        namespace: '{{ $patchedNamespace }}'
