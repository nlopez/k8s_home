# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/nlopez/k8s_home.git
      revision: main
      directories:
      - path: apps/*
      - path: apps/*/overlays/*
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: default
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      sources:
      - repoURL: "https://github.com/nlopez/k8s_home.git"
        targetRevision: main
        path: "{{.path.path}}"
        directory:
          recurse: true
      destination:
        namespace: "{{.path.basename}}"
        server: https://kubernetes.default.svc
  templatePatch: |-
    {{- $patchedName := .path.basename }}
    {{- $patchedNamespace := .path.basename }}
    {{- if gt (len .path.segments) 2 }}
    {{- $patchedName = printf "%s-%s" (index .path.segments 1) .path.basename -}}
    {{- $patchedNamespace = printf "%s" (index .path.segments 1) -}}
    {{- end }}
    metadata:
      name: '{{ $patchedName }}'
    spec:
      destination:
        namespace: '{{ $patchedNamespace }}'
