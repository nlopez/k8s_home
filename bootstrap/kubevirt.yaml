# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubevirt
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - list:
      elements:
      - name: kubevirt
        namespace: kubevirt
  template:
    metadata:
      name: '{{.name}}'
    spec:
      project: default
      syncPolicy:
        automated:
          enabled: true
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      sources:
      - repoURL: 'https://github.com/nlopez/k8s_home.git'
        targetRevision: unstable
        path: bootstrap/kubevirt-manifests
      destination:
        namespace: '{{.namespace}}'
        server: https://kubernetes.default.svc
