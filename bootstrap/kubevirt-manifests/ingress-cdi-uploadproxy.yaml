# Expose cdi-uploadproxy via Tailscale for virtctl image-upload
#
# The cdi-uploadproxy service lives in the cdi namespace on port 443
# (targetPort 8443). This Ingress routes it through the tailscale-operator
# so your Mac can reach it at <hostname>.<tailnet>.tailscale.com:443.
#
# Usage:
#   kubectl apply -f ingress-cdi-uploadproxy.yaml
#
# Then set the override in CDI config:
#   kubectl patch cdi cdi --type merge -n cdi \
#     --patch '{"spec":{"config":{"uploadProxyURLOverride":"https://cdi-uploadproxy.<tailnet>.tailscale.com"}}}'
#
# Or pass --uploadproxy-url explicitly in virtctl commands.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdi-uploadproxy
  namespace: cdi
  annotations:
    tailscale.com/proxy-group: ""
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
    tailscale.com/hostname: cdi-uploadproxy
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - cdi-uploadproxy
  defaultBackend:
    service:
      name: cdi-uploadproxy
      port:
        number: 443
