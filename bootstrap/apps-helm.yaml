# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: argocd
spec:
  # ignoreApplicationDifferences:
  # - jsonPointers:
  #   - /spec/syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  # Progressive Syncs: order the infra tiers instead of syncing all apps at
  # once. Requires the ApplicationSet controller's --enable-progressive-syncs
  # flag (apps-helm/argocd/values.yaml). Each step waits for its tier's
  # Applications to be Healthy before the next tier starts.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
      - matchExpressions:
        - key: tier
          operator: In
          values:
          - network-and-secrets
      - matchExpressions:
        - key: tier
          operator: In
          values:
          - storage
      - matchExpressions:
        - key: tier
          operator: In
          values:
          - platform
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      # ---- tier: network-and-secrets ----
      # CNI, gateway/DNS, and the secrets provider most other apps need to
      # even come up healthy.
      - name: cilium
        tier: network-and-secrets
        repoURL: https://helm.cilium.io
        chart: cilium
        targetRevision: "1.20.0"
        namespace: kube-system
      - name: envoy-gateway
        tier: network-and-secrets
        repoURL: registry-1.docker.io
        chart: envoyproxy/gateway-helm
        targetRevision: 1.7.1
        namespace: envoy-gateway-system
      - name: tailscale-operator
        tier: network-and-secrets
        repoURL: https://pkgs.tailscale.com/helmcharts
        chart: tailscale-operator
        targetRevision: "1.102.2"
        namespace: tailscale
      - name: external-dns
        tier: network-and-secrets
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: "1.21.1"
        namespace: external-dns
      - name: onepassword-connect
        tier: network-and-secrets
        repoURL: https://1password.github.io/connect-helm-charts
        chart: connect
        targetRevision: "2.4.1"
        namespace: 1password
      - name: cert-manager
        tier: network-and-secrets
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.21.0
        namespace: cert-manager
      # ---- tier: storage ----
      # CSI drivers + StorageClass/VolumeSnapshotClasses, and the operators
      # (Velero, CNPG) whose own config depends on those existing.
      - name: democratic-csi-nas1-mtank
        tier: storage
        repoURL: https://democratic-csi.github.io/charts
        chart: democratic-csi
        targetRevision: "0.15.1"
        namespace: democratic-csi-nas1-mtank
      - name: democratic-csi-nas1-mtank-nfs
        tier: storage
        repoURL: https://democratic-csi.github.io/charts
        chart: democratic-csi
        targetRevision: "0.15.1"
        namespace: democratic-csi-nas1-mtank
      - name: democratic-csi-nas1-etank-iscsi
        tier: storage
        repoURL: https://democratic-csi.github.io/charts
        chart: democratic-csi
        targetRevision: "0.15.1"
        namespace: democratic-csi-nas1-etank-iscsi
      - name: democratic-csi-nas1-etank-nfs
        tier: storage
        repoURL: https://democratic-csi.github.io/charts
        chart: democratic-csi
        targetRevision: "0.15.1"
        namespace: democratic-csi-nas1-etank-nfs
      - name: velero
        tier: storage
        repoURL: https://vmware-tanzu.github.io/helm-charts
        chart: velero
        targetRevision: '12.1.0'
        namespace: velero
      - name: cloudnative-pg
        tier: storage
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        targetRevision: "0.29.0"
        namespace: cnpg-system
      # ---- tier: platform ----
      # Everything else: ArgoCD itself and general workloads/add-ons.
      - name: argocd
        tier: platform
        repoURL: "https://argoproj.github.io/argo-helm"
        chart: argo-cd
        targetRevision: '10.3.0'
        namespace: argocd
      - name: metrics-server
        tier: platform
        repoURL: https://kubernetes-sigs.github.io/metrics-server
        chart: metrics-server
        targetRevision: "3.13.1"
        namespace: kube-system
      - name: reloader
        tier: platform
        repoURL: https://stakater.github.io/stakater-charts
        chart: reloader
        targetRevision: "2.2.14"
        namespace: reloader
      - name: node-feature-discovery
        tier: platform
        repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
        chart: node-feature-discovery
        targetRevision: "0.19.0"
        namespace: node-feature-discovery
      - name: intel-device-plugins-gpu
        tier: platform
        repoURL: https://intel.github.io/helm-charts
        chart: intel-device-plugins-gpu
        targetRevision: "0.36.0"
        namespace: intel-device-plugins-gpu
      - name: jellyfin
        tier: platform
        repoURL: https://jellyfin.github.io/jellyfin-helm
        chart: jellyfin
        targetRevision: "3.2.0"
        namespace: jellyfin
      - name: immich
        tier: platform
        repoURL: oci://ghcr.io/immich-app/immich-charts/immich
        targetRevision: '0.13.1'
        namespace: immich
      - name: spegel
        tier: platform
        repoURL: oci://ghcr.io/spegel-org/helm-charts/spegel
        targetRevision: "0.7.4"
        namespace: spegel
      - name: goldpinger
        tier: platform
        repoURL: https://bloomberg.github.io/goldpinger
        chart: goldpinger
        targetRevision: "1.1.2"
        namespace: goldpinger
      - name: tailscale-derp
        tier: platform
        repoURL: oci://ghcr.io/coreweave/tailscale-derp/chart/tailscale-derp
        targetRevision: "0.19.0"
        namespace: tailscale-derp
  template:
    metadata:
      name: "{{.name}}"
      labels:
        tier: "{{.tier}}"
    spec:
      project: default
      syncPolicy:
        automated:
          enabled: true
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      destination:
        namespace: "{{.namespace}}"
        server: https://kubernetes.default.svc
  templatePatch: |-
    spec:
    {{- if eq .name "cilium" }}
      annotations:
        argocd.argoproj.io/compare-options: {{ "ServerSideDiff=false" | quote }}
    {{- end }}
    {{- if eq .name "velero" }}
      ignoreDifferences:
      - kind: ConfigMap
        name: velero-notifier-state
        jsonPointers:
        - /data/activeSince
        - /data/state
    {{- end }}
      sources:
      - repoURL: '{{.repoURL}}'
        {{- if regexMatch "^oci://" .repoURL }}
        path: .
        {{- else }}
        chart: '{{.chart}}'
        {{- end }}
        targetRevision: '{{.targetRevision}}'
        helm:
          valueFiles:
          - $values/apps-helm/{{.name}}/values.yaml
          ignoreMissingValueFiles: true
      - repoURL: 'https://github.com/nlopez/k8s_home.git'
        targetRevision: unstable
        ref: values
      - repoURL: 'https://github.com/nlopez/k8s_home.git'
        targetRevision: unstable
        path: apps-helm/{{.name}}/manifests
