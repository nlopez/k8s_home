# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: argocd
spec:
  # ignoreApplicationDifferences:
  # - jsonPointers:
  #   - /spec/syncPolicy
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - name: argocd
        repoURL: "https://argoproj.github.io/argo-helm"
        chart: argo-cd
        targetRevision: '9.4.17'
        namespace: argocd
      - name: cert-manager
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.20.1
        namespace: cert-manager
      - name: envoy-gateway
        repoURL: registry-1.docker.io
        chart: envoyproxy/gateway-helm
        targetRevision: 1.7.1
        namespace: envoy-gateway-system
      - name: tailscale-operator
        repoURL: https://pkgs.tailscale.com/helmcharts
        chart: tailscale-operator
        targetRevision: "1.94.2"
        namespace: tailscale
      - name: cilium
        repoURL: https://helm.cilium.io
        chart: cilium
        targetRevision: "1.19.2"
        namespace: kube-system
      - name: metrics-server
        repoURL: https://kubernetes-sigs.github.io/metrics-server
        chart: metrics-server
        targetRevision: "3.13.0"
        namespace: kube-system
      - name: reloader
        repoURL: https://stakater.github.io/stakater-charts
        chart: reloader
        targetRevision: "2.2.9"
        namespace: reloader
      - name: node-feature-discovery
        repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
        chart: node-feature-discovery
        targetRevision: "0.18.3"
        namespace: node-feature-discovery
      - name: intel-device-plugins-gpu
        repoURL: https://intel.github.io/helm-charts
        chart: intel-device-plugins-gpu
        targetRevision: "0.35.0"
        namespace: intel-device-plugins-gpu
      - name: external-dns
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: "1.20.0"
        namespace: external-dns
      - name: jellyfin
        repoURL: https://jellyfin.github.io/jellyfin-helm
        chart: jellyfin
        targetRevision: "3.0.0"
        namespace: jellyfin
      - name: cloudnative-pg
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        targetRevision: "0.28.0"
        namespace: cnpg-system
      - name: immich
        repoURL: oci://ghcr.io/immich-app/immich-charts/immich
        targetRevision: '0.11.1'
        namespace: immich
      - name: spegel
        repoURL: oci://ghcr.io/spegel-org/helm-charts/spegel
        targetRevision: "0.6.0"
        namespace: spegel
      - name: onepassword-connect
        repoURL: https://1password.github.io/connect-helm-charts
        chart: connect
        targetRevision: "2.4.1"
        namespace: 1password
  template:
    metadata:
      name: "{{.name}}"
    spec:
      project: default
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      destination:
        namespace: "{{.namespace}}"
        server: https://kubernetes.default.svc
  templatePatch: |-
    spec:
      sources:
      - repoURL: '{{.repoURL}}'
        {{- if regexMatch "^oci://" .repoURL }}
        path: .
        {{- else }}
        chart: '{{.chart}}'
        {{- end }}
        targetRevision: '{{.targetRevision}}'
        helm:
          valueFiles:
          - $values/apps-helm/{{.name}}/values.yaml
          ignoreMissingValueFiles: true
      - repoURL: 'https://github.com/nlopez/k8s_home.git'
        targetRevision: unstable
        ref: values
      - repoURL: 'https://github.com/nlopez/k8s_home.git'
        targetRevision: unstable
        path: apps-helm/{{.name}}/manifests
