# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
  destination:
    name: "in-cluster"
    namespace: cert-manager
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.18.2
      helm: # https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
        parameters:
          - name: crds.enabled
            value: "true"
          - name: crds.keep
            value: "true"
    - repoURL: https://github.com/nlopez/k8s_home
      path: cert-manager-resources
      targetRevision: unstable
