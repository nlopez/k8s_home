---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-toolbox-blue
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  project: default
  source:
    path: media/toolbox/overlays/blue
    repoURL: https://github.com/nlopez/k8s_home
    targetRevision: HEAD
  destination:
    namespace: media
    server: 'https://kubernetes.default.svc'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-toolbox-green
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  project: default
  source:
    path: media/toolbox/overlays/green
    repoURL: https://github.com/nlopez/k8s_home
    targetRevision: HEAD
  destination:
    namespace: media
    server: 'https://kubernetes.default.svc'
