# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
    - CreateNamespace=true
  destination:
    namespace: argocd
    name: "in-cluster"
  sources:
  - chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 8.3.0
    helm:
      # https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
      parameters:
      - name: global.domain
        value: c.desertbluffs.com
  - repoURL: https://github.com/nlopez/k8s_home
    path: argocd-resources
    targetRevision: unstable
