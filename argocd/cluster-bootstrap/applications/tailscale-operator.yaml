# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
  destination:
    name: "in-cluster"
    namespace: tailscale
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.82.0
      helm: # https://github.com/tailscale/tailscale/blob/main/cmd/k8s-operator/deploy/chart/values.yaml
        parameters:
          - name: operatorConfig.defaultTags[0]
            value: "tag:k8s-operator"
          - name: operatorConfig.defaultTags[1]
            value: "tag:home"
          - name: operatorConfig.defaultTags[1]
            value: "tag:lga1"
          - name: operatorConfig.podAnnotations.operator\.1password\.io/item-path
            value: "vaults/copxopw5gkuo2m3cv7acvkrfxy/items/dgz5karhxoosz25a6lk2ndudhi"
          - name: operatorConfig.podAnnotations.operator\.1password\.io/item-name
            value: "operator-oauth"
