# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httpbin
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
    - CreateNamespace=true
  destination:
    namespace: httpbin
    name: "in-cluster"
  sources:
  - repoURL: https://github.com/nlopez/k8s_home
    path: httpbin
    targetRevision: unstable
