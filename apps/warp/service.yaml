# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: warp
  annotations:
    tailscale.com/hostname: warp
    tailscale.com/proxy-group: heimdall
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: warp
  ports:
  - name: warp
    port: 1080
    targetPort: 1080
