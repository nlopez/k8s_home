apiVersion: v1
kind: Service
metadata:
  name: warp
  annotations:
    tailscale.com/hostname: warp
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: warp
  ports:
  - name: warp
    port: 1080
    targetPort: 1080
