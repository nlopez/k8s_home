apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jackett-tailscale
  annotations:
    tailscale.com/proxy-group: heimdall
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
spec:
  tls:
  - hosts:
    - jazzy-hat
  defaultBackend:
    service:
      name: jackett
      port:
        name: http
  ingressClassName: tailscale
