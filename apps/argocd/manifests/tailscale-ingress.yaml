apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  annotations:
    tailscale.com/hostname: argocd
    tailscale.com/proxy-group: ingress-proxies
spec:
  defaultBackend:
    service:
      name: argocd
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - argocd
