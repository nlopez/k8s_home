apiVersion: v1
kind: PersistentVolume
metadata:
  name: palworld-config
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteOnce
  iscsi:
    targetPortal: 192.168.222.149
    iqn: iqn.2014-09.com.radoncanyon:nas1:palworld
    lun: 99
    fsType: ext4
  mountOptions:
  - noatime
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: palworld
spec:
  volumeName: palworld-config
  resources:
    requests:
      storage: 20Gi
  accessModes:
  - ReadWriteOnce
