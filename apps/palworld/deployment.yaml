apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld
  namespace: palworld
  labels:
    app: palworld
    version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: palworld
      version: v1
  template:
    metadata:
      labels:
        app: palworld
        version: v1
    spec:
      containers:
      - name: palworld
        image: ghcr.io/nlopez/palworld-server-docker@sha256:197e4f79ab3a1381dcd3ab53ee11bd0059625228c1fd1cec13bf56763582b55e
        envFrom:
        - configMapRef:
            name: palworld-config
        env:
        - name: INSTALL_UE4SS_EXPERIMENTAL
          value: "true"
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-secrets
              key: adminPassword
        - name: SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-secrets
              key: serverPassword
        ports:
        - name: game
          containerPort: 8211
          protocol: UDP
        - name: query
          containerPort: 27015
          protocol: UDP
        - name: rest-api
          containerPort: 8212
          protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: "6Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: config
          mountPath: /palworld
        - name: savegames
          mountPath: /palworld/Pal/Saved/SaveGames
        startupProbe:
          exec:
            command: ["sh", "-c", "pgrep -f PalServer-Win64-Shipping >/dev/null"]
          failureThreshold: 120
          periodSeconds: 5
        readinessProbe:
          exec:
            command: ["sh", "-c", "pgrep -f PalServer-Win64-Shipping >/dev/null"]
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "pgrep -f PalServer-Win64-Shipping >/dev/null"]
          initialDelaySeconds: 120
          periodSeconds: 20
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: savegames
        persistentVolumeClaim:
          claimName: savegames
