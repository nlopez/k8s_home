# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: saved
  namespace: palworld
spec:
  storageClassName: nas1-mtank-nfs
  resources:
    requests:
      storage: 1Gi
  accessModes:
  - ReadWriteMany
  dataSource:
    name: palworld-saved-restore
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
