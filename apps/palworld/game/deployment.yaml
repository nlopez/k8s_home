# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld
  namespace: palworld
  labels:
    app: palworld
    version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: palworld
      version: v1
  template:
    metadata:
      labels:
        app: palworld
        version: v1
    spec:
      containers:
      - name: palworld
        image: thijsvanloef/palworld-server-docker@sha256:401d3eb5c053bcd72949e1ede8c4e38be5e5ad66be7272ac37940706df0aeb2f
        envFrom:
        - configMapRef:
            name: palworld-config
        env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-secrets
              key: adminPassword
        - name: SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-secrets
              key: serverPassword
        ports:
        - name: game
          containerPort: 8211
          protocol: UDP
        - name: query
          containerPort: 27015
          protocol: UDP
        - name: rest-api
          containerPort: 8212
          protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: "6Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: data
          mountPath: /palworld
        - name: savegames
          mountPath: /palworld/Pal/Saved/SaveGames
        - name: saved
          mountPath: /saved
        startupProbe:
          exec:
            command: ["sh", "-c", "pgrep PalServer-Linux >/dev/null"]
          failureThreshold: 120
          periodSeconds: 5
        readinessProbe:
          exec:
            command: ["sh", "-c", "pgrep PalServer-Linux >/dev/null"]
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "pgrep PalServer-Linux >/dev/null"]
          initialDelaySeconds: 120
          periodSeconds: 20
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: savegames
        persistentVolumeClaim:
          claimName: savegames
      - name: saved
        persistentVolumeClaim:
          claimName: saved
