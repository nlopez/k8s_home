# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# Palworld Save Games WebDAV Share
#
# Serves the savegames volume read-only via WebDAV over Tailscale with HTTPS.
# Accessible at https://savegames.tailscale/savegames
#
# Requires authentication — username/password from 1Password item
# "Palworld WebDAV" (vault: Automation). Read-only access only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld-webdav
  namespace: palworld
  labels:
    app: palworld-webdav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: palworld-webdav
  template:
    metadata:
      labels:
        app: palworld-webdav
    spec:
      containers:
      - name: rclone
        image: rclone/rclone@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
        command:
        - /bin/sh
        - -c
        - |
          exec rclone serve webdav /srv \
            --addr=:5572 \
            --log-level=INFO \
            --log-file=stdout \
            --read-only \
            --local-links \
            --etag-hash auto \
            --user="${RCLONE_USER}" \
            --pass="${RCLONE_PASS}" \
            --header "Access-Control-Allow-Origin:*" \
            --header "Access-Control-Allow-Methods:GET,HEAD,POST,PUT,DELETE,COPY,MOVE,PROPFIND,PROPPATCH,MKCOL,LOCK,UNLOCK" \
            --header "Access-Control-Allow-Credentials:true" \
            --header "Access-Control-Expose-Headers:Content-Length,Content-Range,ETag,Accept-Ranges" \
            --header "Access-Control-Max-Age:3600"
        env:
        - name: RCLONE_USER
          valueFrom:
            secretKeyRef:
              name: palworld-webdav-credentials
              key: username
        - name: RCLONE_PASS
          valueFrom:
            secretKeyRef:
              name: palworld-webdav-credentials
              key: password
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: savegames
          mountPath: /srv
      volumes:
      - name: savegames
        persistentVolumeClaim:
          claimName: savegames
