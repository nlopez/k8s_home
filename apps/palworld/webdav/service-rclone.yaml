# Palworld Save Games WebDAV Service
#
# Exposes the rclone WebDAV server (port 5572) over Tailscale with HTTPS.
# Accessible at https://savegames.tailscale/savegames
apiVersion: v1
kind: Service
metadata:
  name: palworld-webdav
  namespace: palworld
spec:
  type: ClusterIP
  selector:
    app: palworld-webdav
  ports:
  - name: https
    port: 443
    targetPort: 5572
    protocol: TCP
