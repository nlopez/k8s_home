# Palworld Config Editor
#
# Usage:
#   # 1. Bring up the editor:
#       kubectl scale deployment palworld-editor --replicas=1 -n palworld
#   # 2. Open a shell:
#       kubectl exec -it palworld-editor -- vi /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
#   # 3. Scale it back down:
#       kubectl scale deployment palworld-editor --replicas=0 -n palworld
#   # 4. Restart the server to pick up changes:
#       kubectl rollout restart deployment palworld -n palworld
#
# Notes:
#   - Edit config files ONLY when the server is NOT running.
#   - The container runs as uid/gid 1000:1000 (matching the game's PUID/PGID)
#     so file permissions stay consistent.
#   - Environment variables from palworld-config ConfigMap will override
#     PalWorldSettings.ini values at startup. Settings not covered by env vars
#     should be edited directly in the .ini files.
#   - DISABLE_GENERATE_SETTINGS is already set to "true" in the ConfigMap,
#     so PalWorldSettings.ini won't be regenerated on boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld-editor
  namespace: palworld
  labels:
    app: palworld-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: palworld-editor
  template:
    metadata:
      labels:
        app: palworld-editor
    spec:
      containers:
      - name: editor
        image: alpine:3.20
        command: ["/bin/sh", "-c", "apk add --no-cache vim && sleep infinity"]
        resources:
          requests:
            cpu: "1m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        - name: config
          mountPath: /palworld
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      securityContext:
        fsGroup: 1000
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
