# Custom Samba configuration for palworld-saves
#
# Requires authentication — no guest access. Clients must provide
# the username/password stored in the 1Password item "Palworld SMB".
# The [global] section disables Apple-specific VFS modules
# that aren't needed for save game files.
#
# To add more shares, add additional [section] blocks below with
# path = /<mount-path> and the appropriate read-only settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: palworld-smb-conf
  namespace: palworld
data:
  smb.conf: |-
    [global]
        server string = Palworld Saves
        security = user
        server min protocol = SMB2

        # Disable guest/anonymous access
        map to guest = never
        guest ok = no

        # Disable printing
        load printers = no
        printing = bsd
        printcap name = /dev/null
        disable spoolss = yes

        # General settings
        host msdfs = no
        wide links = yes
        follow symlinks = yes
        unix extensions = no
        ea support = yes
        mangled names = no
        dos charset = CP850
        unix charset = UTF-8

    [savegames]
        path = /share
        comment = Palworld Save Games
        browseable = yes
        read only = yes
        guest ok = no
        writable = no
        valid users = palworld-smb
        force user = 1000
        force group = 1000
