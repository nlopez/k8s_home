apiVersion: v1
kind: ConfigMap
metadata:
  name: palworld-smb-config
  namespace: palworld
data:
  smb.conf: |-
    [global]
        server string = samba
        idmap config * : range = 3000-7999
        security = user
        server min protocol = SMB2
        map to guest = never
        guest ok = no

        load printers = no
        printing = bsd
        printcap name = /dev/null
        disable spoolss = yes

        host msdfs = no
        wide links = yes
        follow symlinks = yes
        unix extensions = no
        acl allow execute always = yes

        ea support = yes

        # --- File watch / notification tuning ---
        oplocks = yes                  # Opportunistic locks for better read caching
        level2 oplocks = yes           # Level-2 oplocks for read-only shares (directory metadata caching)
        strict locking = auto          # Proper locking with automatic fallback
        share modes = yes              # Allow SMB share-level file locking
        kernel oplocks = yes           # Use kernel-level oplocks when available
        enable asu2 = yes              # Enable async I/O for better throughput
        use sendfile = yes             # Use kernel sendfile() for reads
        aio read size = 1              # Enable asynchronous read (1 = auto)
        aio write size = 0             # Keep writes synchronous (read-only share)
        getwd cache = yes              # Cache getcwd() calls
        directory cache = yes          # Cache directory entries

    [saves]
        path = /storage
        comment = Palworld Saves
        browseable = yes
        writable = no
        read only = yes

        # --- Per-share file watch / notification tuning ---
        oplocks = yes                  # Inherit global, explicit for clarity
        level2 oplocks = yes           # Critical: lets Windows cache directory listings
        strict locking = no            # No write locking needed on read-only share
        create mask = 0444             # Explicit read-only file mask
        directory mask = 0555          # Explicit read-only directory mask
        hide unreadable = yes          # Don't show files the client can't read
