# SMB share definitions for palworld-saves
#
# dockurr/samba env vars:
#   NAME  — share display name
#   RW    — "false" for read-only, "true" for read-write
#   UID   — container user ID
#   GID   — container group ID
#
# Guest access is enabled via the custom smb.conf (smb.conf.yaml).
# To add more shares, mount additional volumes and override smb.conf
# with a multi-share config (see comments in smb.conf.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: palworld-smb-shares
  namespace: palworld
data:
  NAME: savegames
  RW: "false"
  UID: "1000"
  GID: "1000"
