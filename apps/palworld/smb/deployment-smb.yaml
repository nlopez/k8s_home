# Palworld Save Games SMB Share
#
# Serves the savegames volume read-only via SMB/CIFS over Tailscale.
# Accessible at smb://palworld-saves.tailscale/savegames
#
# Guest (anonymous) access enabled via custom smb.conf.
#
# To add more shares:
#   1. Add a PVC + volumeMount for the new share's path
#   2. Add a [section] block to configmap-smb.conf.yaml
#   3. Restart the deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld-smb
  namespace: palworld
  labels:
    app: palworld-smb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: palworld-smb
  template:
    metadata:
      labels:
        app: palworld-smb
    spec:
      containers:
      - name: samba
        image: dockurr/samba@sha256:9e4dd0594f2f023c48b752519be2846ae193e75b7ef462c037435eac4b835dc2
        envFrom:
        - configMapRef:
            name: palworld-smb-shares
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        # Share data
        - name: savegames
          mountPath: /share
        # Custom smb.conf (overrides dockurr/samba default)
        - name: smb-conf
          mountPath: /etc/samba/smb.conf
          subPath: smb.conf
      volumes:
      # Share data
      - name: savegames
        persistentVolumeClaim:
          claimName: savegames
      # Custom smb.conf
      - name: smb-conf
        configMap:
          name: palworld-smb-conf
