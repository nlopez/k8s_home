# OnePasswordItem for Palworld backup credentials
# Creates a Kubernetes Secret with S3 credentials and Discord webhook
# from the referenced 1Password item
#
# The resulting K8s Secret keys match the field names in the 1Password item.
# Common field names for S3: s3AccessKey, s3SecretKey (or similar).
# Common field name for Discord: discordWebhook (or url).
# Adjust the secret key names below if your OP item uses different field labels.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: palworld-backup-secrets
  namespace: palworld
spec:
  itemPath: "vaults/copxopw5gkuo2m3cv7acvkrfxy/items/xf54gi4nfpabfq5m5yenuuvsqq"
