# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: icloudpd
spec:
  suspend: false
  concurrencyPolicy: Forbid
  timeZone: America/New_York
  schedule: '0 */6 * * *'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400 # 4h, leaves room for a large catch-up run before the next 6h trigger
      template:
        metadata:
          labels:
            tags.datadoghq.com/env: homelab
            tags.datadoghq.com/service: icloudpd
            tags.datadoghq.com/version: v1
        spec:
          serviceAccountName: default
          restartPolicy: Never
          # Alpine/musl's resolver aborts the whole ndots search-domain list on
          # the first SERVFAIL instead of falling through (unlike glibc, which
          # continues to the next suffix). Tailscale's injected search domains
          # (macaroni-pirate.ts.net, <tailnet>) get forwarded externally by
          # CoreDNS and come back SERVFAIL for made-up subdomains, which
          # aborts resolution of the actual bare hostname (e.g. icloud.com).
          # ndots:1 makes any dotted hostname resolve as absolute first,
          # skipping that search-suffix path.
          dnsConfig:
            options:
            - name: ndots
              value: "1"
          containers:
          - name: icloudpd
            # Fork of boredazfcuk/docker-icloudpd that bundles icloudpd 1.33.0, which fixes
            # --xmp-sidecar crashing the whole run on assets with malformed adjustment data.
            # Switch back to docker.io/boredazfcuk/icloudpd once upstream ships icloudpd >= 1.33.0.
            #   skopeo inspect --override-os linux --override-arch amd64 --format '{{.Digest}}' docker://ghcr.io/nlopez/docker-icloudpd:<tag>
            image: ghcr.io/nlopez/docker-icloudpd@sha256:b602cfd437f4a69b6e1611b1bb122829fc6aba76837d662faf77f3215295b3df
            imagePullPolicy: Always
            env:
            - name: TZ
              value: "America/New_York"
            volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /home/user/iCloud
              subPath: icloud
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: config
          - name: media
            persistentVolumeClaim:
              claimName: media
