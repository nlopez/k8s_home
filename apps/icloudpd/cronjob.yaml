# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: icloudpd
spec:
  suspend: true
  concurrencyPolicy: Forbid
  timeZone: America/New_York
  schedule: '0 * * * *'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3300 # 55m - leaves a buffer before the next hourly trigger
      template:
        spec:
          serviceAccountName: default
          restartPolicy: Never
          # Alpine/musl's resolver aborts the whole ndots search-domain list on
          # the first SERVFAIL instead of falling through (unlike glibc, which
          # continues to the next suffix). Tailscale's injected search domains
          # (macaroni-pirate.ts.net, <tailnet>) get forwarded externally by
          # node-local-dns and come back SERVFAIL for made-up subdomains, which
          # aborts resolution of the actual bare hostname (e.g. icloud.com).
          # ndots:1 makes any dotted hostname resolve as absolute first,
          # skipping that search-suffix path.
          dnsConfig:
            options:
            - name: ndots
              value: "1"
          containers:
          - name: icloudpd
            # IMAGE=boredazfcuk/icloudpd; skopeo --override-os linux list-tags "docker://${IMAGE}" | jq -r '.Tags[]' | grep '^[0-9]' | sort -V | tail -n1
            image: docker.io/boredazfcuk/icloudpd:1.0.1369_30-05-2026
            imagePullPolicy: Always
            env:
            - name: TZ
              value: "America/New_York"
            volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /home/user/iCloud
              subPath: icloud
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: config
          - name: media
            persistentVolumeClaim:
              claimName: media
