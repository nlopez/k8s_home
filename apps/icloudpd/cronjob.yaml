# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: icloudpd
spec:
  concurrencyPolicy: Forbid
  timeZone: America/New_York
  schedule: '0 * * * *'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3300 # 55m - leaves a buffer before the next hourly trigger
      template:
        spec:
          serviceAccountName: default
          restartPolicy: Never
          containers:
          - name: icloudpd
            # IMAGE=boredazfcuk/icloudpd; skopeo --override-os linux list-tags "docker://${IMAGE}" | jq -r '.Tags[]' | grep '^[0-9]' | sort -V | tail -n1
            image: docker.io/boredazfcuk/icloudpd:1.0.1369_30-05-2026
            imagePullPolicy: Always
            env:
            - name: TZ
              value: "America/New_York"
            volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /home/user/iCloud
              subPath: icloud
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: config
          - name: media
            persistentVolumeClaim:
              claimName: media
