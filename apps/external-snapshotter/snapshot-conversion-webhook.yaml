# Snapshot Conversion Webhook
# Provides conversion between VolumeGroupSnapshot v1beta1 and v1beta2 APIs.
# Deploy alongside the snapshot controller and CRDs.
# Source: https://github.com/kubernetes-csi/external-snapshotter
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-conversion-webhook
  namespace: kube-system
  labels:
    app.kubernetes.io/name: snapshot-conversion-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snapshot-conversion-webhook
rules:
- apiGroups:
  - groupsnapshot.storage.k8s.io
  resources:
  - volumegroupsnapshotcontents
  verbs:
  - get
  - list
  - watch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snapshot-conversion-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snapshot-conversion-webhook
subjects:
- kind: ServiceAccount
  name: snapshot-conversion-webhook
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-conversion-webhook
  namespace: kube-system
  labels:
    app.kubernetes.io/name: snapshot-conversion-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-conversion-webhook
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapshot-conversion-webhook
    spec:
      serviceAccountName: snapshot-conversion-webhook
      containers:
      - name: snapshot-conversion-webhook
        image: registry.k8s.io/sig-storage/snapshot-conversion-webhook:v8.5.0
        imagePullPolicy: IfNotPresent
        args:
        - --tls-cert-file=/etc/snapshot-conversion-webhook/certs/tls.crt
        - --tls-private-key-file=/etc/snapshot-conversion-webhook/certs/tls.key
        ports:
        - containerPort: 443
        volumeMounts:
        - name: snapshot-conversion-webhook-certs
          mountPath: /etc/snapshot-conversion-webhook/certs
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
      volumes:
      - name: snapshot-conversion-webhook-certs
        secret:
          secretName: snapshot-conversion-webhook-secret
---
apiVersion: v1
kind: Service
metadata:
  name: snapshot-conversion-webhook-service
  namespace: kube-system
  labels:
    app.kubernetes.io/name: snapshot-conversion-webhook
spec:
  selector:
    app.kubernetes.io/name: snapshot-conversion-webhook
  ports:
  - protocol: TCP
    port: 443
    targetPort: 443
---
# CA certificate and webhook configuration
# The create-cert.sh script from external-snapshotter generates the secret
# and patches the CRD. Run this after deploying:
#   ./deploy/kubernetes/webhook-example/create-cert.sh \
#     --service snapshot-conversion-webhook-service \
#     --secret snapshot-conversion-webhook-secret \
#     --namespace kube-system
# Then patch the CRD:
#   kubectl patch crd volumegroupsnapshotcontents.groupsnapshot.storage.k8s.io \
#     -p "$(cat <<EOF
# {
#   "spec": {
#     "conversion": {
#       "strategy": "Webhook",
#       "webhook": {
#         "clientConfig": {
#           "service": {
#             "name": "snapshot-conversion-webhook-service",
#             "namespace": "kube-system",
#             "path": "/convert"
#           }
#         },
#         "conversionReviewVersions": ["v1beta1", "v1beta2"]
#       }
#     }
#   }
# }
# EOF
# )"
apiVersion: v1
kind: Secret
metadata:
  name: snapshot-conversion-webhook-secret
  namespace: kube-system
  # NOTE: This placeholder will be overwritten by create-cert.sh
  # The script creates a proper TLS cert signed by the cluster CA.
type: kubernetes.io/tls
annotations:
  # This is a placeholder — run create-cert.sh to generate real certs
  note: "Run deploy/kubernetes/webhook-example/create-cert.sh to generate TLS certificates"
