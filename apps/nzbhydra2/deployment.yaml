---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.33.4-standalone-strict/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbhydra2
spec:
  replicas: 1
  strategy:
    type: RollingUpdatez
  selector:
    matchLabels:
      app: nzbhydra2
  template:
    metadata:
      labels:
        app: nzbhydra2
    spec:
      volumes:
      - name: nzbhydra2-config
        persistentVolumeClaim:
          claimName: nzbhydra2-iscsi-pvc
      - name: nzbhydra2
        persistentVolumeClaim:
          claimName: nzbhydra2
      containers:
      - name: nzbhydra2
        # IMAGE=ghcr.io/linuxserver/nzbhydra2; skopeo --override-os linux list-tags "docker://${IMAGE}" | jq -r '.Tags[]' | sort -V | tail -n1
        # image: ghcr.io/linuxserver/nzbhydra2:version-v7.15.3
        image: alpine
        command: [ "sleep" ]
        args: [ "infinity" ]
        volumeMounts:
        - name: nzbhydra2-config
          subPath: config
          mountPath: /config-iscsi
        - name: nzbhydra2-config
          subPath: config
          mountPath: /config
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1001"
        - name: TZ
          value: "America/New_York"
        ports:
        - containerPort: 5076
          name: http
        # livenessProbe:
        #   httpGet:
        #     port: http
        #     path: /internalapi/control/ping
        #   periodSeconds: 10
        #   failureThreshold: 3
        # startupProbe:
        #   httpGet:
        #     port: http
        #     path: /internalapi/control/ping
        #   periodSeconds: 10
        #   failureThreshold: 30
