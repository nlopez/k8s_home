---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.33.4-standalone-strict/persistentvolume.json
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nzbhydra2-iscsi-pv
spec:
  capacity:
    storage: 2G
  accessModes:
  - ReadWriteOnce
  iscsi:
    targetPortal: 192.168.222.149
    iqn: iqn.2014-09.com.radoncanyon:nas1:hydra2
    lun: 1
    fsType: ext4
  mountOptions:
  - noatime
  persistentVolumeReclaimPolicy: Retain
