apiVersion: v1
kind: PersistentVolume
metadata:
  name: config-sonarr
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  iscsi:
    targetPortal: 192.168.222.149
    iqn: iqn.2014-09.com.radoncanyon:nas1:sonarr-ssd
    lun: 1
    fsType: ext4
  mountOptions:
  - noatime
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  volumeName: config-sonarr
  resources:
    requests:
      storage: 10Gi
  accessModes:
  - ReadWriteOnce
