# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sonarr-egress
spec:
  endpointSelector:
    matchLabels:
      app: sonarr
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchName: feed.animetosho.net
        - matchName: feed.animetosho.xyz
        - matchName: api.nzbgeek.info
        - matchName: thexem.info
        - matchName: skyhook.sonarr.tv
        - matchName: services.sonarr.tv
        - matchName: artworks.thetvdb.com
        - matchName: sentry.servarr.com
        - matchName: nas2.lga1.radoncanyon.com
  # Plex library-refresh notifications.
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: pms
        app: pms
    toPorts:
    - ports:
      - port: "32400"
        protocol: TCP
  # Download clients on the NAS hosts.
  - toCIDR:
    - 192.168.222.149/32 # nas1
    - 192.168.222.114/32 # nas2
    toPorts:
    - ports:
      - port: "30024"
        protocol: TCP
  - toCIDR:
    - 192.168.222.114/32 # nas2
    toPorts:
    - ports:
      - port: "30055"
        protocol: TCP
  # Indexers, metadata and update checks: HTTPS to the names allowed in the
  # DNS rule above. Cilium's DNS proxy maps the resolved IPs back to these
  # names, so the rule follows CDN address changes.
  - toFQDNs:
    - matchName: feed.animetosho.net
    - matchName: feed.animetosho.xyz
    - matchName: api.nzbgeek.info
    - matchName: thexem.info
    - matchName: skyhook.sonarr.tv
    - matchName: services.sonarr.tv
    - matchName: artworks.thetvdb.com
    - matchName: sentry.servarr.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
