# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Forward auth via the authentik embedded outpost's "envoy" proxy provider.
# See apps-helm/authentik/manifests/referencegrant-forward-auth.yaml for why
# this targets the plain authentik-server Service instead of a dedicated
# outpost Service.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sonarr-forward-auth
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: sonarr
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: sonarr-private
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
    - "X-Forwarded-For"
    - "X-Real-Ip"
    - "accept"
    - "cookie"
    - "authorization"
    - "proxy-authorization"
    - "x-forwarded-proto"
    http:
      backendRefs:
      - group: ''
        kind: Service
        name: authentik-server
        namespace: authentik
        port: 80
        weight: 1
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
      - "Set-Cookie"
      - "X-authentik-uid"
      - "X-authentik-username"
      - "X-authentik-name"
      - "X-authentik-email"
      - "X-authentik-groups"
      - "X-authentik-entitlements"
