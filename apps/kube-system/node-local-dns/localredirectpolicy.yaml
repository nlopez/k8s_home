# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumlocalredirectpolicy_v2.json
# Steers traffic bound for the kube-dns Service to this node's own
# node-local-dns pod instead, via Cilium's eBPF-based redirect. Required
# because kube-proxy is disabled here (see apps-helm/cilium/values.yaml,
# localRedirectPolicies.enabled), so there's no iptables chain for the
# classic nodelocaldns.yaml addon to hook into.
# https://docs.cilium.io/en/stable/network/kubernetes/local-redirect-policy/#node-local-dns-cache
apiVersion: "cilium.io/v2"
kind: CiliumLocalRedirectPolicy
metadata:
  name: "nodelocaldns"
  namespace: kube-system
spec:
  redirectFrontend:
    serviceMatcher:
      serviceName: kube-dns
      namespace: kube-system
  redirectBackend:
    localEndpointSelector:
      matchLabels:
        k8s-app: node-local-dns
    toPorts:
    - port: "53"
      name: dns
      protocol: UDP
    - port: "53"
      name: dns-tcp
      protocol: TCP
