# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
# NOTE: excluded from the kubeconform pre-commit hook (see .pre-commit-config.yaml) —
# the initContainer's `<<: *pms` merge-key override is valid YAML/K8s but trips
# kubeconform -strict's duplicate-key detector as a false positive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms
  labels:
    app: pms
    version: v1
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: pms
    tags.datadoghq.com/version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pms
      version: v1
  template:
    metadata:
      labels:
        app: pms
        version: v1
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: pms
        tags.datadoghq.com/version: v1
    spec:
      serviceAccountName: pms
      containers:
      - &pms
        name: pms
        # IMAGE=ghcr.io/linuxserver/plex; skopeo --override-os linux list-tags "docker://${IMAGE}" | jq -r '.Tags[]' | sort -V | tail -n1
        image: ghcr.io/linuxserver/plex:version-1.43.3.10896-cb3ebc72d
        # image: docker.io/alpine:latest
        # command: [ "sleep" ]
        # args: [ "infinity" ]
        resources:
          limits:
            gpu.intel.com/i915: "1"
        livenessProbe:
          httpGet:
            port: https
            path: /identity
          initialDelaySeconds: 60
          periodSeconds: 5
          failureThreshold: 3
        env:
        - name: DO_DB_REPAIR
          value: "false"
        - name: DB_REPAIR_REV
          value: "8fc8df3a2f057d2d962429ff11f2750bc3464f79"
        - name: CHANGE_CONFIG_DIR_OWNERSHIP
          value: "false"
        - name: PLEX_UID
          value: "1001"
        - name: PLEX_GID
          value: "1001"
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1001"
        - name: TZ
          value: "America/New_York"
        - name: VERSION
          value: "docker" # don't auto update
        ports:
        - name: https
          containerPort: 32400
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config-nas1-mtank
      - name: media
        persistentVolumeClaim:
          claimName: media
      - name: tmp
        emptyDir:
          medium: Memory
      initContainers:
      - !!merge <<: *pms
        name: plex-db-repair
        livenessProbe: null
        command:
        - sh
        - -c
        - '[ "${DO_DB_REPAIR:-false}" = "false" ] && exit 0 || (curl --silent --show-error https://raw.githubusercontent.com/ChuckPa/PlexDBRepair/${DB_REPAIR_REV:-master}/DBRepair.sh | bash -s - auto prune
          exit)'
        ports: []
