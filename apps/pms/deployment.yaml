---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms
  labels:
    app: pms
    version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pms
      version: v1
  template:
    metadata:
      labels:
        app: pms
        version: v1
    spec:
      serviceAccountName: pms
      containers:
      - &pms
        name: pms
        # IMAGE=lscr.io/linuxserver/plex; skopeo --override-os linux list-tags "docker://${IMAGE}" | jq -r '.Tags[]' | sort -V | tail -n1
        image: lscr.io/linuxserver/plex:version-1.42.2.10156-f737b826c
        # image: docker.io/alpine:latest
        # command: [ "sleep" ]
        # args: [ "infinity" ]
        resources:
          limits:
            gpu.intel.com/i915: "1"
        livenessProbe:
          httpGet:
            port: https
            path: /identity
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            port: https
            path: /identity
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: DO_DB_REPAIR
          value: "false"
        - name: DB_REPAIR_REV
          value: "dea8a805ce3033411ddd9871105310e2cfab4bf2"
        - name: CHANGE_CONFIG_DIR_OWNERSHIP
          value: "false"
        - name: PLEX_UID
          value: "1001"
        - name: PLEX_GID
          value: "1001"
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1001"
        - name: TZ
          value: "America/New_York"
        - name: VERSION
          value: "docker" # don't auto update
        ports:
        - name: https
          containerPort: 32400
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: media
        persistentVolumeClaim:
          claimName: media
      - name: tmp
        emptyDir:
          medium: Memory
      initContainers:
      - !!merge <<: *pms
        name: plex-db-repair
        livenessProbe: null
        command:
        - sh
        - -c
        - '[ "${DO_DB_REPAIR:-false}" = "false" ] && exit 0 || (curl --silent --show-error https://raw.githubusercontent.com/ChuckPa/PlexDBRepair/${DB_REPAIR_REV:-master}/DBRepair.sh | bash -s - auto prune exit)'
        ports: []
