apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-ingress
  annotations:
    tailscale.com/proxy-group: heimdall
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
spec:
  tls:
  - hosts:
    - quizzical-queen.macaroni-pirate.ts.net
  defaultBackend:
    service:
      name: pms
      port:
        number: 32400
  ingressClassName: tailscale
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/tailnet-fqdn: "quizzical-queen.macaroni-pirate.ts.net"
    tailscale.com/proxy-group: mercury
  name: ts-egress
spec:
  externalName: placeholder # any value - will be overwritten by the operator
  type: ExternalName
  ports:
  - port: 32400
    protocol: TCP
    name: https-32400 # ignored
  - port: 443
    protocol: TCP
    name: https-443 # ignored
