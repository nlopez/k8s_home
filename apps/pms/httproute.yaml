apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pms-private
spec:
  parentRefs:
  - name: private
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - quizzical-queen.radoncanyon.com
  - quizzical-queen.desertbluffs.com
  rules:
  - backendRefs:
    - name: pms
      port: 32400
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
