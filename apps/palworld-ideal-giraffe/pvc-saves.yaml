# Saves restored from fresh snapshot of original palworld savegames.
# Restores from: snapcontent-1f1587da-7a93-4828-8977-2d456d6a1303
# (VolumeSnapshotContent is cluster-scoped, no namespace issue)
# Mounted at /palworld/Pal/Saved/SaveGames to overlay the game's save directory.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: saves
  namespace: palworld-ideal-giraffe
spec:
  storageClassName: nas1-mtank-nfs
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
