# Saves restored from fresh snapshot of original palworld savegames.
# Restores from: palworld-saves-snapshot-fresh (VolumeSnapshot)
# Mounted at /palworld/Pal/Saved/SaveGames to overlay the game's save directory.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: saves
  namespace: palworld-ideal-giraffe
spec:
  storageClassName: nas1-mtank-nfs
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  dataSource:
    kind: VolumeSnapshot
    name: palworld-saves-snapshot-fresh
    apiGroup: snapshot.storage.k8s.io
