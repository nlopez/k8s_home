# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytpot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ytpot
  template:
    metadata:
      labels:
        app: ytpot
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: ytpot
        tags.datadoghq.com/version: v1
    spec:
      containers:
      - name: ytpot
        image: docker.io/brainicism/bgutil-ytdlp-pot-provider:1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646b
