# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytpot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ytpot
  template:
    metadata:
      labels:
        app: ytpot
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: ytpot
        tags.datadoghq.com/version: v1
    spec:
      containers:
      - name: ytpot
        image: docker.io/brainicism/bgutil-ytdlp-pot-provider:1.3.2@sha256:9a96e6385ce1928da87dea07b1cab0413d2cf8c07a3b8a8bd419f53df2c3843c
