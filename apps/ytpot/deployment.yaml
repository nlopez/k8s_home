# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytpot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ytpot
  template:
    metadata:
      labels:
        app: ytpot
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: ytpot
        tags.datadoghq.com/version: v1
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ytpot
        image: docker.io/brainicism/bgutil-ytdlp-pot-provider:2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
