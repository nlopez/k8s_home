# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
data:
  sonarr.yml: |-
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    sonarr:
      web-1080p:
        base_url: http://sonarr.sonarr.svc.cluster.local
        api_key: !env_var SONARR_API_KEY
        quality_definition:
          type: series
        quality_profiles:
        # WEB-1080p
        - trash_id: 72dae194fc92bf828f32cde7744e51a1
          reset_unmatched_scores:
            enabled: true
        # [Anime] Remux-1080p
        - trash_id: 20e0fc959f1f1704bed501f23bdae76f
          reset_unmatched_scores:
            enabled: true
  radarr.yml: |-
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    radarr:
      hd-bluray-web:
        base_url: http://radarr.radarr.svc.cluster.local
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
        quality_profiles:
        # HD Bluray + WEB
        - trash_id: d1d67249d3890e49bc12e275d989a7e9
          reset_unmatched_scores:
            enabled: true
        # Remux + WEB 1080p
        - trash_id: 9ca12ea80aa55ef916e3751f4b874151
          reset_unmatched_scores:
            enabled: true
        # Keep release-version tags (Hybrid, Criterion, 4K Remaster) in renamed files
        custom_format_groups:
          add:
          # [Optional] Movie Versions
          - trash_id: f4f1474b963b24cf983455743aa9906c
            select:
            - eca37840c13c6ef2dd0262b141a5482f  # 4K Remaster
            - e0c07d59beb37348e975a930d5e50319  # Criterion Collection
            - 0f12c086e289cf966fa5948eac571f44  # Hybrid
        # {imdb-id} in curly braces is read by both Plex and Jellyfin
        media_naming:
          folder: plex-imdb
          movie:
            rename: true
            standard: plex-imdb
