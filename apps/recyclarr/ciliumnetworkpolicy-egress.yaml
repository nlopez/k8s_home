# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: recyclarr-egress
spec:
  endpointSelector:
    matchLabels:
      tags.datadoghq.com/service: recyclarr
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchName: github.com
        - matchName: discord.com
        - matchName: sonarr.sonarr.svc.cluster.local
        - matchName: radarr.radarr.svc.cluster.local
  # Config pushes to Sonarr and Radarr.
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: sonarr
        app: sonarr
    toPorts:
    - ports:
      - port: "8989"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: radarr
        app: radarr
    toPorts:
    - ports:
      - port: "7878"
        protocol: TCP
  - toFQDNs:
    - matchName: github.com
    - matchName: discord.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
