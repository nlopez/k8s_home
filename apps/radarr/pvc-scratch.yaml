# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolume-v1.json
apiVersion: v1
kind: PersistentVolume
metadata:
  name: scratch-radarr
  labels:
    name: scratch-radarr
spec:
  capacity:
    storage: 1Pi
  accessModes:
  - ReadWriteMany
  nfs:
    server: 192.168.222.149
    path: "/mnt/etank/scratch"
  mountOptions:
  - nfsvers=4.1
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
  - noresvport
  - _netdev
  - nofail
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: scratch
spec:
  volumeName: scratch-radarr
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Pi
