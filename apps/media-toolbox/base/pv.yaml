---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media
  labels:
    name: media
spec:
  accessModes:
  - ReadWriteMany
  nfs:
    server: 192.168.222.114
    path: "/mnt/etank/media"
  mountOptions:
  - nfsvers=4.1
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
  - noresvport
  - _netdev
  - nofail
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  capacity: 1Pi
