# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: obsidian-livesync
  labels:
    app: obsidian-livesync
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: obsidian-livesync
    tags.datadoghq.com/version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-livesync
  template:
    metadata:
      labels:
        app: obsidian-livesync
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: obsidian-livesync
        tags.datadoghq.com/version: v1
    spec:
      initContainers:
      - name: init-config
        image: busybox:1.37
        command:
        - /bin/sh
        - -c
        - |
          cp /config/local.ini /data/local.ini
          chown couchdb:couchdb /data/local.ini
          chmod 644 /data/local.ini
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: local-d
          mountPath: /data
      containers:
      - name: couchdb
        image: couchdb:3.5.2.1
        env:
        - name: COUCHDB_USER
          valueFrom:
            secretKeyRef:
              name: obsidian-livesync-couchdb
              key: COUCHDB_USER
        - name: COUCHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: obsidian-livesync-couchdb
              key: COUCHDB_PASSWORD
        ports:
        - name: http
          containerPort: 5984
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /opt/couchdb/data
        - name: local-d
          mountPath: /opt/couchdb/etc/local.d
        livenessProbe:
          tcpSocket:
            port: 5984
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 5984
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: obsidian-livesync-data
      - name: local-d
        persistentVolumeClaim:
          claimName: obsidian-livesync-locald
      - name: config
        configMap:
          name: couchdb-config
