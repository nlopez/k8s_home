# DataVolume for Windows OS disk upload
# Declarative — CDI manages the upload lifecycle
# ArgoCD tracks this resource; status progresses from Pending → Succeeded after upload
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: os-disk
  namespace: palworld-windows
spec:
  source:
    upload: {}
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 80Gi
    storageClassName: nas1-mtank-iscsi
