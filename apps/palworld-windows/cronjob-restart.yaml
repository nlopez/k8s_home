# Palworld VM restart CronJob
#
# Restarts the Palworld server daily at 6:15 AM New York time.
#
# Flow:
#   1. Trigger a REST API save to flush world state
#   2. Stop the VM gracefully
#   3. Start the VM again
#   4. Send Discord notification
#
# Zero impact on players during off-peak hours (6:15 AM ET).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: palworld-restart
  namespace: palworld-windows
  labels:
    app: palworld
    component: restart
spec:
  schedule: "15 6 * * *"
  timeZone: America/New_York
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600 # 10 min max per job
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: palworld-restart
          containers:
          - name: restart
            image: alpine/k8s:1.36.2
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              NAMESPACE="palworld-windows"
              VM_NAME="palworld"
              DISCORD_TIME=$(echo "<t:$(date +%s):f>")

              send_discord() {
                local title="$1"
                local color="$2"
                local status="$3"
                local details="$4"

                local json="{
                  \"embeds\": [{
                    \"title\": \"${title}\",
                    \"color\": ${color},
                    \"fields\": [
                      {\"name\": \"Status\", \"value\": \"${status}\", \"inline\": true},
                      {\"name\": \"Time\", \"value\": \"${DISCORD_TIME}\", \"inline\": true},
                      {\"name\": \"Details\", \"value\": \"${details}\", \"inline\": false}
                    ],
                    \"footer\": {\"text\": \"Palworld Windows Restart\", \"icon_url\": \"https://cdn2.steamgriddb.com/icon/9ce60c64ac4510df68537de96631261f/32/256x256.png\"}
                  }]
                }"

                if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
                  curl -sL --data "$json" \
                    --header="Content-Type: application/json" \
                    "${DISCORD_WEBHOOK_URL}" || true
                fi
              }

              # ---- Step 1: Trigger a save via REST API ----
              echo "Triggering save via REST API..."
              # Get the VM pod IP (the pod running the VM)
              POD_IP=$(kubectl get vmipod -n "$NAMESPACE" -l "app=$VM_NAME" \
                -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || true)

              if [ -n "$POD_IP" ]; then
                SAVE_RESPONSE=$(curl -s --max-time 30 \
                  "http://$POD_IP:8212/save" 2>&1) || true
                echo "Save response: $SAVE_RESPONSE"
                sleep 30
              else
                echo "VM pod not reachable, skipping REST save"
              fi

              # ---- Step 2: Stop the VM gracefully ----
              echo "Stopping VM..."
              virtctl stop "$VM_NAME" -n "$NAMESPACE"

              # Wait for VM to be fully stopped
              echo "Waiting for VM to stop..."
              for i in $(seq 1 30); do
                STATUS=$(kubectl get vm "$VM_NAME" -n "$NAMESPACE" \
                  -o jsonpath='{.status.printableStatus}' 2>/dev/null || echo "unknown")
                echo "  VM status: $STATUS (attempt $i/30)"
                if echo "$STATUS" | grep -qi "stopped\|stopped\|stopped"; then
                  break
                fi
                sleep 10
              done

              # ---- Step 3: Start the VM ----
              echo "Starting VM..."
              virtctl start "$VM_NAME" -n "$NAMESPACE"

              # Wait for VM to be running
              echo "Waiting for VM to start..."
              for i in $(seq 1 60); do
                STATUS=$(kubectl get vm "$VM_NAME" -n "$NAMESPACE" \
                  -o jsonpath='{.status.printableStatus}' 2>/dev/null || echo "unknown")
                echo "  VM status: $STATUS (attempt $i/60)"
                if echo "$STATUS" | grep -qi "running"; then
                  break
                fi
                sleep 10
              done

              echo "Restart complete."

              # ---- Step 4: Discord notification ----
              send_discord "Palworld Windows Restart \u2713" 5763713 "SUCCESS" \
                "VM restarted successfully"

              echo "Restart job completed successfully"
            env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: palworld-restart-secrets
                  key: url
                  optional: true
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                cpu: 200m
---
# ServiceAccount for the restart CronJob
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palworld-restart
  namespace: palworld-windows
  labels:
    app: palworld
    component: restart
---
# Role to manage VMs and get pod info
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: palworld-windows
  name: palworld-restart-role
  labels:
    app: palworld
    component: restart
rules:
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachineinstances"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
# Bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: palworld-windows
  name: palworld-restart-binding
  labels:
    app: palworld
    component: restart
subjects:
- kind: ServiceAccount
  name: palworld-restart
  namespace: palworld-windows
roleRef:
  kind: Role
  name: palworld-restart-role
  apiGroup: rbac.authorization.k8s.io
