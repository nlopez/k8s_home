# OS disk for Windows Server 2022 — reference only
# Not tracked by ArgoCD. Created imperatively by virtctl image-upload.
# iSCSI-backed for performance (storage class: nas1-mtank-iscsi)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: os-disk
  namespace: palworld-windows
spec:
  storageClassName: nas1-mtank-iscsi
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
